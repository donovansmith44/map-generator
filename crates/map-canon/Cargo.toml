[package]
name = "map-canon"
version = "0.1.0"
edition = "2021"

# The canonical data spine (2026-08-27 design): content-addressed
# borders/features/snapshots, worlds as timestamp-keyed sets, layered
# canon with fail-loud validators. Depends only on the covenant (time,
# ids, hashing discipline) and map-types (geometry + the canonical-byte
# writer) — no adapters, no providers, no encoders.
[dependencies]
atlas-graph-types.workspace = true
map-types = { path = "../map-types" }
serde_json = { version = "1", features = ["float_roundtrip"] }

serde = { version = "1", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
