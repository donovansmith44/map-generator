[package]
name = "map-encoders"
version = "0.1.0"
edition = "2021"
description = "Terminal scene encoders for map-generator (law 11): each concrete output format lives here and only here, behind SceneEncoder, deterministic byte for byte."

[dependencies]
map-types = { path = "../map-types" }
atlas-graph-types.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
approx = "0.5"
serde = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }
