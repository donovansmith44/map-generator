<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>map-generator — workbench</title>
<style>
  :root {
    --room: #191c22;
    --panel: #22262e;
    --edge: #343943;
    --ink: #d6d3c8;
    --dim: #8a8f98;
    --stop: #c43b2f;
    --stop-soft: #7a3a34;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--room);
    color: var(--ink);
    font: 13px/1.5 var(--mono);
    display: grid;
    grid-template-columns: 300px 1fr;
    grid-template-rows: 100vh;
  }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }

  /* ------------------------------------------------ instrument rail */
  #rail {
    background: var(--panel);
    border-right: 1px solid var(--edge);
    padding: 18px 16px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  #wordmark { letter-spacing: .08em; }
  #wordmark b { color: var(--ink); font-weight: 600; }
  #wordmark span { color: var(--dim); }
  .group { border-top: 1px solid var(--edge); padding-top: 12px; }
  .group h2 {
    font-size: 10px; font-weight: 400; letter-spacing: .22em;
    color: var(--dim); text-transform: uppercase; margin-bottom: 8px;
  }
  label { color: var(--dim); display: block; margin: 6px 0 2px; }
  select, button {
    font: inherit; color: var(--ink); background: var(--room);
    border: 1px solid var(--edge); border-radius: 3px; padding: 4px 8px;
    width: 100%;
  }
  button { cursor: pointer; transition: border-color 120ms; }
  button:hover { border-color: var(--dim); }
  button:focus-visible, select:focus-visible, .tick:focus-visible {
    outline: 2px solid var(--stop); outline-offset: 1px;
  }
  .inline { display: flex; gap: 6px; align-items: center; }
  .inline > * { width: auto; }
  input[type="checkbox"] { accent-color: var(--stop); }
  .radio-row { display: flex; gap: 10px; }
  .radio-row label { display: flex; gap: 4px; align-items: center; margin: 0; color: var(--ink); }

  /* --------------------------------------------------- the scrubber */
  #readout { font-size: 22px; margin-bottom: 6px; }
  #readout small { color: var(--dim); font-size: 11px; display: block; }
  #scrub { position: relative; height: 34px; margin: 4px 0 6px; }
  #scrub::before {
    content: ""; position: absolute; left: 0; right: 0; top: 24px;
    height: 1px; background: var(--edge);
  }
  .tick {
    position: absolute; top: 10px; width: 9px; height: 22px;
    transform: translateX(-50%);
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .tick::after {
    content: ""; position: absolute; left: 4px; top: 4px; bottom: 0;
    width: 1px; background: var(--stop-soft); transition: background 120ms;
  }
  .tick.dawn::after { background: var(--dim); }
  .tick.off::after { opacity: 0.25; }
  .tick:hover::after { background: var(--ink); }
  .tick.active::after { background: var(--stop); width: 3px; left: 3px; top: 0; opacity: 1; }
  #stepper { display: flex; gap: 6px; }
  #stepper button { width: 34px; }
  #stepper .spacer { flex: 1; color: var(--dim); align-self: center; text-align: center; }

  /* --------------------------------------------- subject time chips */
  #mapped { margin-top: 8px; }
  #mapped .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip {
    width: auto; padding: 1px 7px; font-size: 11px;
    border: 1px solid var(--edge); border-radius: 9px; background: var(--room);
    color: var(--ink); cursor: pointer;
  }
  .chip.now { border-color: var(--stop); color: var(--stop); }

  /* ------------------------------------------------------ the plate */
  #bench { display: flex; flex-direction: column; min-width: 0; }
  #plate {
    flex: 1; overflow: hidden; display: grid; place-items: center; padding: 14px;
    cursor: grab; touch-action: none;
  }
  #plate.dragging { cursor: grabbing; }
  #plate svg {
    max-width: 100%; max-height: 100%; height: auto;
    background: #10120f;
    border: 1px solid var(--edge);
    box-shadow: 0 0 60px rgba(0,0,0,.5);
  }
  #plate svg path[data-region] { cursor: pointer; }
  #plate svg path[data-region]:hover { stroke: var(--stop); stroke-width: 1.2; }
  #plate pre {
    max-width: 100%; max-height: 100%; overflow: auto;
    color: var(--dim); font-size: 11px; padding: 12px;
    border: 1px solid var(--edge); background: var(--panel);
  }
  #hint {
    text-align: center; color: var(--dim); font-size: 11px; padding: 2px 0 4px;
  }
  #status {
    border-top: 1px solid var(--edge); padding: 6px 14px;
    color: var(--dim); font-size: 11px;
    display: flex; gap: 18px; flex-wrap: wrap;
  }
  #status b { color: var(--ink); font-weight: 400; }

  /* -------------------------------------------------- log & overlay */
  #log { max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  #log div { color: var(--dim); }
  #log .k { color: var(--stop); }
  #held { color: var(--dim); margin: 6px 0; min-height: 18px; }
  #held b { color: var(--ink); font-weight: 400; }
  .btnrow { display: flex; gap: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<nav id="rail">
  <div id="wordmark"><b>MAP-GENERATOR</b> <span>/ workbench</span></div>

  <section class="group" aria-label="time">
    <h2>Time</h2>
    <div id="readout">—<small>scrub stops are change events — the piecewise timeline itself</small></div>
    <div id="scrub"></div>
    <div id="stepper">
      <button id="prev" aria-label="previous change">‹</button>
      <div class="spacer" id="stopcount"></div>
      <button id="next" aria-label="next change">›</button>
    </div>
    <label class="inline" style="margin-top:8px">
      <input type="checkbox" id="expose"> long exposure from
      <select id="from" disabled style="flex:1"></select>
    </label>
  </section>

  <section class="group" aria-label="subject">
    <h2>Subject</h2>
    <select id="subject"></select>
    <label class="inline" style="margin-top:6px"><input type="checkbox" id="context" checked> whole globe as context</label>
    <div id="mapped" hidden>
      <label>mapped at</label>
      <div class="chips"></div>
    </div>
  </section>

  <section class="group" aria-label="appearance">
    <h2>Style</h2>
    <div class="radio-row" id="styles"></div>
    <label>projection</label>
    <div class="radio-row" id="projections"></div>
    <label for="lod">detail</label>
    <select id="lod">
      <option value="0" selected>exact</option>
      <option value="0.0015">medium</option>
      <option value="0.008">coarse</option>
    </select>
    <label class="inline" style="margin-top:6px"><input type="checkbox" id="labels" checked> labels</label>
  </section>

  <section class="group" aria-label="encoder">
    <h2>Encoder</h2>
    <div class="radio-row" id="encoders"></div>
  </section>

  <section class="group" aria-label="overlay">
    <h2>Overlay scratchpad</h2>
    <div id="held">nothing held</div>
    <div class="btnrow">
      <button id="hold">hold this</button>
      <button id="compose" disabled>compose</button>
      <button id="drop" disabled>drop</button>
    </div>
  </section>

  <section class="group" aria-label="changes">
    <h2>Changes at this stop</h2>
    <div id="log"></div>
  </section>
</nav>

<main id="bench">
  <div id="plate" aria-live="polite"></div>
  <div id="hint">drag to rotate · scroll to zoom · click a region to focus it · esc to deselect · double-click to reset the view</div>
  <div id="status"></div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const state = {
  stops: [], idx: 0, styles: [], style: null,
  encoder: "svg", projection: "globe", subject: "world", held: null,
  view: { lat: null, lon: null, zoom: null },   // null = server decides
  resolved: null,                                // what the last svg reported
  subjectStops: null,                            // stops the subject is mapped at
};

const fmtYear = y => y < 0 ? `${-y} BC` : `AD ${y}`;

function currentParams(quality) {
  const year = state.stops[state.idx];
  const p = new URLSearchParams();
  p.set("subject", state.subject);
  if ($("expose").checked && $("from").value !== "") {
    p.set("year", $("from").value);
    p.set("to", year);
  } else {
    p.set("year", year);
  }
  p.set("style", state.style);
  p.set("encoder", state.encoder);
  p.set("projection", state.projection);
  p.set("context", $("context").checked ? "1" : "0");
  if (state.view.lat !== null) p.set("center", state.view.lat.toFixed(3) + "," + state.view.lon.toFixed(3));
  if (state.view.zoom !== null) p.set("zoom", state.view.zoom.toFixed(3));
  if (quality === "drag") {
    p.set("lod", "0.008");
    p.set("labels", "0");
  } else {
    p.set("lod", $("lod").value);
    p.set("labels", $("labels").checked ? "1" : "0");
  }
  return p;
}

let inFlight = false, queued = null;
async function render(quality) {
  if (inFlight) { queued = quality || "full"; return; }
  inFlight = true;
  try {
    const p = currentParams(quality);
    const res = await fetch("/api/render?" + p.toString());
    const body = await res.text();
    showPlate(res, body, p.get("encoder"));
  } finally {
    inFlight = false;
    if (queued) { const q = queued === "full" ? undefined : queued; queued = null; render(q); }
  }
}

function showPlate(res, body, encoder) {
  const plate = $("plate");
  if (!res.ok) { plate.innerHTML = ""; plate.textContent = body; setStatus({error: body}); return; }
  if (encoder === "svg") {
    plate.innerHTML = body;
    const svg = plate.querySelector("svg");
    if (svg && svg.dataset.clat !== undefined) {
      state.resolved = {
        lat: parseFloat(svg.dataset.clat),
        lon: parseFloat(svg.dataset.clon),
        zoom: parseFloat(svg.dataset.zoom),
      };
    }
  } else {
    plate.innerHTML = "";
    const pre = document.createElement("pre");
    pre.textContent = body;
    plate.appendChild(pre);
  }
  setStatus({
    attribution: res.headers.get("X-Attribution") || "—",
    scene: res.headers.get("X-Scene-Pid"),
    query: res.headers.get("X-Query-Pid"),
    bytes: body.length,
  });
}

function setStatus(s) {
  const el = $("status");
  el.innerHTML = "";
  const add = (k, v) => { if (!v) return; const d = document.createElement("span"); d.innerHTML = `${k} <b></b>`; d.querySelector("b").textContent = v; el.appendChild(d); };
  if (s.error) { add("error", s.error); return; }
  add("sources", s.attribution);
  add("scene", s.scene);
  add("query", s.query);
  add("bytes", s.bytes);
}

// ----------------------------------------------------- globe navigation

function resetView() {
  state.view = { lat: null, lon: null, zoom: null };
}

function beginNav() {
  // Seed explicit navigation from wherever the last artifact stood.
  if (state.view.lat === null && state.resolved) {
    state.view = { ...state.resolved };
  }
  return state.view.lat !== null;
}

function setupPlateNav() {
  const plate = $("plate");
  let drag = null;
  plate.addEventListener("pointerdown", e => {
    if (state.projection !== "globe" || state.encoder !== "svg") return;
    if (!beginNav()) return;
    // No pointer capture yet: capturing here would retarget the
    // eventual click away from the region path under the cursor.
    drag = { id: e.pointerId, x: e.clientX, y: e.clientY, lat: state.view.lat, lon: state.view.lon, moved: false };
  });
  plate.addEventListener("pointermove", e => {
    if (!drag) return;
    const rect = plate.querySelector("svg")?.getBoundingClientRect();
    if (!rect) return;
    const degPerPx = (2 * state.view.zoom) / rect.width;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 4) {
      drag.moved = true;
      plate.classList.add("dragging");
      plate.setPointerCapture(drag.id);
    }
    if (!drag.moved) return;
    state.view.lon = drag.lon - dx * degPerPx;
    state.view.lat = Math.max(-89, Math.min(89, drag.lat + dy * degPerPx));
    render("drag");
  });
  let suppressClick = false;
  const finish = () => {
    if (!drag) return;
    const moved = drag.moved;
    drag = null;
    plate.classList.remove("dragging");
    suppressClick = moved;
    if (moved) render(); // settle at full quality
  };
  plate.addEventListener("pointerup", finish);
  plate.addEventListener("pointercancel", finish);

  let settle = null;
  plate.addEventListener("wheel", e => {
    if (state.projection !== "globe" || state.encoder !== "svg") return;
    e.preventDefault();
    if (!beginNav()) return;
    const factor = e.deltaY > 0 ? 1.18 : 1 / 1.18;
    state.view.zoom = Math.max(2, Math.min(90, state.view.zoom * factor));
    render("drag");
    clearTimeout(settle);
    settle = setTimeout(() => render(), 220);
  }, { passive: false });

  plate.addEventListener("dblclick", () => { resetView(); render(); });

  // Click a region on the map to focus it (a drag is not a click).
  plate.addEventListener("click", e => {
    if (suppressClick) { suppressClick = false; return; }
    const path = e.target.closest && e.target.closest("path[data-region]");
    if (!path) return;
    const key = "region:" + path.dataset.region;
    focusSubject(key, { keepView: true });
  });
}

// ------------------------------------------------------- subject focus

async function focusSubject(key, opts) {
  state.subject = key;
  const sel = $("subject");
  if ([...sel.options].some(o => o.value === key)) sel.value = key;
  if (!(opts && opts.keepView)) resetView();
  await loadMappedTimes();
  drawScrubber();
  render();
}

async function loadMappedTimes() {
  const box = $("mapped");
  if (state.subject === "world") {
    state.subjectStops = null;
    box.hidden = true;
    return;
  }
  const res = await fetch("/api/region_times?subject=" + encodeURIComponent(state.subject));
  const data = await res.json();
  state.subjectStops = new Set(data.stops);
  const chips = box.querySelector(".chips");
  chips.innerHTML = "";
  data.stops.forEach(y => {
    const c = document.createElement("button");
    c.className = "chip" + (y === state.stops[state.idx] ? " now" : "");
    c.textContent = fmtYear(y);
    c.addEventListener("click", () => setStop(state.stops.indexOf(y)));
    chips.appendChild(c);
  });
  box.hidden = data.stops.length === 0;
}

// ----------------------------------------------------------- scrubber

function drawScrubber() {
  const scrub = $("scrub");
  scrub.innerHTML = "";
  const min = state.stops[0], max = state.stops[state.stops.length - 1];
  state.stops.forEach((y, i) => {
    const b = document.createElement("button");
    const off = state.subjectStops && !state.subjectStops.has(y);
    b.className = "tick" + (i === 0 ? " dawn" : "") + (i === state.idx ? " active" : "") + (off ? " off" : "");
    b.style.left = (2 + 96 * (y - min) / (max - min)) + "%";
    b.title = fmtYear(y)
      + (i === 0 ? " — before the first recorded change" : "")
      + (off ? " — no mapping for the focused subject" : "");
    b.addEventListener("click", () => setStop(i));
    scrub.appendChild(b);
  });
  $("stopcount").textContent = `${state.idx + 1} / ${state.stops.length}`;
  $("readout").firstChild.textContent = fmtYear(state.stops[state.idx]);
}

async function setStop(i) {
  state.idx = Math.max(0, Math.min(state.stops.length - 1, i));
  await Promise.all([loadSubjects(), loadChanges(), loadFromOptions(), loadMappedTimes()]);
  drawScrubber();
  render();
}

async function loadSubjects() {
  const res = await fetch("/api/subjects?year=" + state.stops[state.idx]);
  const rows = await res.json();
  const sel = $("subject");
  const keep = state.subject;
  sel.innerHTML = "";
  for (const r of rows) {
    const o = document.createElement("option");
    o.value = r.key; o.textContent = r.label;
    sel.appendChild(o);
  }
  if (rows.some(r => r.key === keep)) {
    sel.value = keep;
  } else if (keep !== "world" && state.subjectStops) {
    // Focused subject absent here: keep the focus, the chips and the
    // dimmed ticks say where it lives; the plate will say NothingAtTime.
    const o = document.createElement("option");
    o.value = keep; o.textContent = "(not mapped at this stop)";
    sel.appendChild(o);
    sel.value = keep;
  } else {
    sel.value = "world";
    state.subject = "world";
  }
}

async function loadChanges() {
  const log = $("log");
  log.innerHTML = "";
  if (state.idx === 0) { log.textContent = "the state before the first recorded change"; return; }
  const from = state.stops[state.idx - 1], to = state.stops[state.idx];
  const res = await fetch(`/api/changes?from=${from}&to=${to}`);
  const rows = await res.json();
  const counts = {};
  rows.forEach(r => counts[r.kind] = (counts[r.kind] || 0) + 1);
  const summary = document.createElement("div");
  summary.innerHTML = Object.entries(counts).map(([k, n]) => `<span class="k">${n}</span> ${k}`).join(" · ");
  log.appendChild(summary);
  rows.slice(0, 40).forEach(r => {
    const d = document.createElement("div");
    d.textContent = `${r.kind} ${r.subject.slice(0, 24)}`;
    log.appendChild(d);
  });
  if (rows.length > 40) { const d = document.createElement("div"); d.textContent = `… and ${rows.length - 40} more`; log.appendChild(d); }
}

function loadFromOptions() {
  const sel = $("from");
  sel.innerHTML = "";
  state.stops.slice(0, state.idx).forEach(y => {
    const o = document.createElement("option");
    o.value = y; o.textContent = fmtYear(y);
    sel.appendChild(o);
  });
  sel.disabled = !$("expose").checked || sel.options.length === 0;
  if (sel.options.length) sel.value = sel.options[0].value;
}

function radioRow(el, items, current, onpick) {
  el.innerHTML = "";
  for (const it of items) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio"; input.name = el.id; input.value = it.value;
    input.checked = it.value === current;
    input.addEventListener("change", () => onpick(it.value));
    label.appendChild(input);
    label.appendChild(document.createTextNode(it.name));
    el.appendChild(label);
  }
}

async function init() {
  const meta = await (await fetch("/api/meta")).json();
  state.stops = meta.stops;
  state.styles = meta.styles;
  state.style = meta.styles[0].id;
  state.idx = Math.max(0, meta.stops.length - 4);
  radioRow($("styles"), meta.styles.map(s => ({ name: s.name, value: s.id })), state.style,
    v => { state.style = v; render(); });
  radioRow($("encoders"), meta.encoders.map(e => ({ name: e, value: e })), state.encoder,
    v => { state.encoder = v; render(); });
  radioRow($("projections"), (meta.projections || ["globe", "flat"]).map(e => ({ name: e, value: e })), state.projection,
    v => { state.projection = v; resetView(); render(); });
  $("prev").addEventListener("click", () => setStop(state.idx - 1));
  $("next").addEventListener("click", () => setStop(state.idx + 1));
  $("subject").addEventListener("change", e => focusSubject(e.target.value));
  $("context").addEventListener("change", () => render());
  $("lod").addEventListener("change", () => render());
  $("labels").addEventListener("change", () => render());
  $("expose").addEventListener("change", () => { loadFromOptions(); render(); });
  $("from").addEventListener("change", () => render());
  $("hold").addEventListener("click", () => {
    state.held = currentParams();
    $("held").innerHTML = "held: <b></b>";
    $("held").querySelector("b").textContent =
      `${state.subject} @ ${fmtYear(state.stops[state.idx])}`;
    $("compose").disabled = $("drop").disabled = false;
  });
  $("drop").addEventListener("click", () => {
    state.held = null;
    $("held").textContent = "nothing held";
    $("compose").disabled = $("drop").disabled = true;
  });
  $("compose").addEventListener("click", async () => {
    if (!state.held) return;
    const now = currentParams();
    const p = new URLSearchParams();
    for (const [k, v] of state.held) if (["subject","year","to"].includes(k)) p.set("a_" + k, v);
    for (const [k, v] of now) if (["subject","year","to"].includes(k)) p.set("b_" + k, v);
    for (const k of ["style","encoder","projection","lod","labels","center","zoom"]) {
      if (now.get(k) !== null) p.set(k, now.get(k));
    }
    const res = await fetch("/api/overlay?" + p.toString());
    showPlate(res, await res.text(), now.get("encoder"));
  });
  // Esc: drop the focus, back to the whole world in its own dress.
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && state.subject !== "world") {
      focusSubject("world");
    }
  });
  setupPlateNav();
  await setStop(state.idx);
}
init();
</script>
</body>
</html>
