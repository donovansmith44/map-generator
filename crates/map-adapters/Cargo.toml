[package]
name = "map-adapters"
version = "0.1.0"
edition = "2021"
description = "Source adapters for map-generator — phase 2. Turns one source's bytes into a lawful WorldTimeline behind an interface we can back out of (covenant rule 7)."

# The types crate stays zero-dep; adapters may carry parsing deps.
# serde_json is vendorable for the offline story.
[dependencies]
map-types = { path = "../map-types" }
atlas-graph-types.workspace = true
serde_json = { version = "1", features = ["float_roundtrip"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
