[package]
name = "map-types"
version = "0.1.0"
edition = "2021"
description = "map-generator domain types — phase 1 of docs/map-system-handoff.md. The compiled crate is the authority; the design laws are its tests."

[dependencies]
atlas-graph-types = { version = "0.24" }
serde = { version = "1", features = ["derive"], optional = true }
utoipa = { version = "6", optional = true }

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }

[features]
default = []
serde = ["dep:serde", "atlas-graph-types/serde"]
openapi = ["serde", "dep:utoipa", "atlas-graph-types/openapi"]
canon-ids = ["atlas-graph-types/canon-ids"]
