[evidence]
source = "kjv"
licence = "public_domain"
provenance = "KJV Joshua 13-19 and Numbers 34; MAPS-C12 1399 and 1446 golden specifications, 2026-10-07"
site_authority = "atlas_site_claims"
course_authority = "atlas_selected_border_evidence"
geometry = "none"
relation_vocabulary = "travel_position_neighbour_extent_listed_boundary_reference"
relation_scope = "Travel concerns this survey border; Position names its subject explicitly; Neighbour side places its target relative to its subject lot. Reference records a mentioned referent without asserting a border visit. Targets resolve to named references within the same survey; feature parts are textual, never coordinates."
justification = "This table records Scripture's survey evidence. C14 selects Site claims with alternatives; X16 selects Course evidence and draws through the shared partition. A named place is not an exact coordinate and a text sequence is not an interpolated polygon."
alternative = "Retain each competing Site and Course claim in the atlas; an unlocated place or segment remains recorded without geometry."

[dating]
scale = "exodus_1446"
exodus_year = -1446
exodus_grounds = ["1KI.6.1"]
temple_begun_year = -966
temple_begun_precision = "approximate"
exodus_to_temple_years = 480
source_chronology = "Ussher is retained as source provenance only; none of his dates supplies an adopted interval endpoint."
late_wilderness_year = -1407
late_wilderness_grounds = ["NUM.33.38", "DEU.1.3", "NUM.33.50", "NUM.36.13"]
gilgal_from_year = -1401
gilgal_to_year = -1400
gilgal_grounds = ["JOS.14.6", "JOS.14.7", "JOS.14.10"]
division_from_year = -1401
division_to_year = -1399
shown_at_year = -1399
shown_at_basis = "owner_ruled"
shown_at_grounds = ["JOS.18.1", "JOS.19.51"]
alternative_years = [-1400, -1401]
justification = "The fortieth year uses inclusive counting: 1446 minus 39 is 1407. Caleb's forty-five years and ages give circa 1401-1400. Shiloh follows Gilgal without its own exact year; 1399 is the owner-chosen completed-allotment stop. Joshua 13 recalls Moses' earlier grants; no lot is asserted at 1446."
alternative = "1400 uses Caleb's ages as elapsed years; 1401 uses the inclusive forty-five years. Neither reading dates the Shiloh survey exactly. Joshua 19:47 is undated and is recorded separately. No universal shift is applied to other chronology."


