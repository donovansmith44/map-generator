tion between two points in time.", "newbie": "When the map animates from one year to another, it needs to describe *how* things change on screen — a border smoothly sliding, a kingdom fading into existence, an empire visibly splitting into two successor states — before any actual animation code (CSS, video, etc.) exists to play it. This file defines that description as data: a `TransitionScript` is just a list of steps like 'morph this border from these points to those points' or 'this region splits into these children along this line', kept completely separate from any particular way of eventually rendering the animation. That separation matters because the same abstract animation description can later be turned into a web animation, a video export, or something else entirely, without redoing the animation logic itself.", "intermediate": "`TransitionStep` is an enum: `Morph{boundary, from_pts, to_pts}` for continuous slerp-based interpolation (requiring equal point counts, per law 4 referenced in the comment — see geom::morph_rings), `FadeIn`/`FadeOut{region}` for regions appearing or disappearing, and `SplitAlong`/`MergeAcross` for topology changes that get their own explicit verb rather than being represented as a 'morph' (the doc comment is emphatic: 'an empire does not morph into its successors, it SPLITS'). `TransitionScript` is simply `{ steps: Vec<TransitionStep> }` and implements the crate's `Monoid` trait (algebra.rs): `empty()` is a script with no steps, and `combine` appends one script's steps after another's — i.e. 'run self, then other'.", "advanced": "The `Monoid` implementation here is what makes `MapProvider::transition`'s laws (provider.rs) checkable as algebra rather than as a pile of special cases: 'transition(t, t) is empty' corresponds exactly to `TransitionScript::empty()`, and 'composed transitions agree with the direct one' corresponds to `combine`'s associativity — both are proven as property tests in tests.rs rather than merely asserted in prose. Choosing `Split`/`Merge` as distinct, first-class `TransitionStep` (and `ChangeKind`, in timeline.rs) variants rather than trying to express them as a degenerate case of `Morph` is a deliberate 'types over tricks' decision: a split has a genuinely different shape (one parent, multiple children, plus an explicit `seam: Vec<UnitVec>` describing where the cut runs) that cannot be faithfully squeezed into a from-points/to-points morph without either losing information or inventing a fake intermediate topology. This file currently has no encoder behind it (encode.rs's `TransitionEncoder` is described there as the 'promised treatment... when transition encoding lands'), so `TransitionScript` today is a fully-specified semantic type awaiting its terminal consumer — a clean illustration of the crate's overall discipline of finishing the semantic model before committing to any output format.", "key_items": ["TransitionStep — Morph/FadeIn/FadeOut/SplitAlong/MergeAcross: honest, distinct animation verbs", "TransitionScript — a sequenceable Vec<TransitionStep>", "impl Monoid for TransitionScript — empty script is identity; combine appends (run self, then other)", "SplitAlong{parent, seam, children} / MergeAcross{parents, child} — topology change kept distinct from continuous Morph"]}]}}};

const CRATE_BLURB = {
  "map-adapters":"Reads the raw outside-world data — historical basemaps, rivers, terrain, authored biblical surveys — and turns each source into a shape the rest of the engine can use.",
  "map-partition":"Cuts the whole sphere into one clean set of regions that tile the globe without gaps or overlaps.",
  "map-compile":"The offline build: it assembles the canonical timeline of who-held-what-when, bridging authored scripture and atlas data into the store.",
  "map-canon":"The canonical store — the single source of truth: every feature, border, and layer, and how they change through time.",
  "map-provider":"Answers one question over and over: “draw the scene at year Y.” It reads the canon and composes a picture.",
  "map-encoders":"Turns a composed scene into bytes a client can draw — the binary wire format for the WebGL globe, plus SVG and GeoJSON.",
  "map-viewer":"The HTTP server and browser workbench — it holds the compiled canon in memory and serves the interactive map.",
  "map-types":"The shared vocabulary every other crate speaks: pieces, scenes, geometry, styles, the timeline, and the algebra the whole system obeys."
};

const LEVELS = [
  { key:"newbie",       label:"New to Rust",        hint:"What this file is for, and why it exists — in plain English." },
  { key:"intermediate", label:"Getting comfortable", hint:"How it works: the main pieces and the Rust ideas behind them." },
  { key:"advanced",     label:"Digging in",          hint:"The real detail — signatures, algorithms, invariants, and why." }
];
const LVAR = ["--l1","--l2","--l3"];

let curLevel = 0;
try { const s = localStorage.getItem("atlas.level"); if (s!==null) curLevel = Math.max(0,Math.min(2,+s)); } catch {}
let curFile = null; // path

const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };

/* ---- flow ---- */
function buildFlow(){
  const flow = $("#flow"); flow.innerHTML="";
  DATA.pipeline.forEach((cr,i)=>{
    const node = el("div","flow-node");
    const chip = el("button","flow-chip",cr);
    chip.dataset.crate = cr;
    chip.addEventListener("click",()=>{ openCrate(cr); });
    node.appendChild(chip);
    if (i < DATA.pipeline.length-1) node.appendChild(el("span","flow-arrow","→"));
    flow.appendChild(node);
  });
  const base = el("div","flow-base");
  base.appendChild(el("span",null,"all speak"));
  DATA.base.forEach(cr=>{
    const chip = el("button","flow-chip",cr); chip.dataset.crate=cr;
    chip.addEventListener("click",()=>openCrate(cr)); base.appendChild(chip);
  });
  flow.appendChild(base);
}
function markFlow(cr){ document.querySelectorAll(".flow-chip").forEach(c=>c.classList.toggle("active", c.dataset.crate===cr)); }

/* ---- tree ---- */
function orderedCrates(){ return [...DATA.pipeline, ...DATA.base]; }
function buildTree(filter){
  const tree = $("#tree"); tree.innerHTML="";
  const f = (filter||"").trim().toLowerCase();
  orderedCrates().forEach((cr,idx)=>{
    const info = DATA.crates[cr]; if(!info) return;
    let files = info.files;
    if (f) files = files.filter(x => x.path.toLowerCase().includes(f) || (x.title||"").toLowerCase().includes(f) || cr.includes(f));
    if (f && !files.length && !cr.includes(f)) return;
    const isBase = DATA.base.includes(cr);
    const g = el("div","crate-group");
    if (!f) { try { if(localStorage.getItem("atlas.collapse."+cr)==="1") g.classList.add("collapsed"); } catch{} }
    const head = el("button","crate-head");
    const ix = el("span","crate-idx"+(isBase?" base":""), isBase?"∗":String(idx+1));
    head.appendChild(ix);
    head.appendChild(el("span","crate-name",cr));
    head.appendChild(el("span","crate-caret","▾"));
    head.addEventListener("click",()=>{
      g.classList.toggle("collapsed");
      try{ localStorage.setItem("atlas.collapse."+cr, g.classList.contains("collapsed")?"1":"0"); }catch{}
    });
    g.appendChild(head);
    const ul = el("ul","file-list");
    files.forEach(file=>{
      const li = el("button","file-item");
      li.dataset.path = file.path;
      li.appendChild(el("span",null,file.title||file.path.split("/").pop()));
      li.appendChild(el("span","fi-path", file.path.replace("crates/"+cr+"/","")));
      li.addEventListener("click",()=>openFile(file.path));
      if (file.path===curFile) li.classList.add("active");
      ul.appendChild(li);
    });
    g.appendChild(ul);
    tree.appendChild(g);
  });
}

/* ---- find a file ---- */
function findFile(path){
  for (const cr of orderedCrates()){
    const info = DATA.crates[cr]; if(!info) continue;
    const hit = info.files.find(x=>x.path===path);
    if (hit) return { crate:cr, file:hit };
  }
  return null;
}

/* ---- render detail: a file ---- */
function openFile(path, push){
  curFile = path;
  const found = findFile(path); if(!found){ openHome(); return; }
  const { crate, file } = found;
  markFlow(crate);
  document.querySelectorAll(".file-item").forEach(li=>li.classList.toggle("active", li.dataset.path===path));
  // ensure its group is open
  const active = document.querySelector('.file-item[data-path="'+CSS.escape(path)+'"]');
  if (active){ const grp = active.closest(".crate-group"); if(grp) grp.classList.remove("collapsed"); active.scrollIntoView({block:"nearest"}); }

  const d = $("#detail");
  d.innerHTML="";
  const crumb = el("div","crumb");
  crumb.innerHTML = 'crate <b>'+crate+'</b> &nbsp;·&nbsp; '+ (idxLabel(crate));
  d.appendChild(crumb);
  d.appendChild(el("h1","title", file.title || file.path.split("/").pop()));
  d.appendChild(el("div","filepath", file.path));
  d.appendChild(el("p","role", file.role||""));

  // level control
  const lv = el("div","levels");
  LEVELS.forEach((L,i)=>{
    const b = el("button","lvl"+(i===curLevel?" active":""));
    b.dataset.lvl = String(i);
    const pips = el("span","pips");
    for(let k=0;k<3;k++) pips.appendChild(el("span","pip"));
    b.appendChild(pips);
    b.appendChild(el("span",null,L.label));
    b.addEventListener("click",()=>{ curLevel=i; try{localStorage.setItem("atlas.level",i)}catch{}; renderLevel(file); syncLevelBtns(); });
    lv.appendChild(b);
  });
  d.appendChild(lv);
  d.appendChild(el("div","lvl-hint", LEVELS[curLevel].hint)).id="lvlHint";

  const rail = el("div","depth-rail"); const fill = el("div","depth-fill"); rail.appendChild(fill); d.appendChild(rail);
  const ex = el("div","explain"); ex.id="explainBox"; d.appendChild(ex);

  // key items
  if (file.key_items && file.key_items.length){
    d.appendChild(el("div","keys-h","Key pieces"));
    const wrap = el("div","keys");
    file.key_items.forEach(k=>{
      const row = el("div","key");
      const dash = k.indexOf(" — ")>=0 ? " — " : (k.indexOf(" - ")>=0?" - ":null);
      if (dash){ const [n,...r]=k.split(dash); row.appendChild(el("span","kname",n.trim())); row.appendChild(el("span","kdesc",r.join(dash).trim())); }
      else { row.appendChild(el("span","kname",k)); row.appendChild(el("span","kdesc","")); }
      wrap.appendChild(row);
    });
    d.appendChild(wrap);
  }

  const foot = el("div","foot");
  foot.textContent = "Reading “"+crate+"”. Use the depth control above to go from plain-English to the real internals. Everything here describes the code as it stands in the repo.";
  d.appendChild(foot);

  renderLevel(file);
  d.scrollTo?.(0,0); window.scrollTo({top:0,behavior:"smooth"});
}

function idxLabel(crate){
  const i = DATA.pipeline.indexOf(crate);
  if (i>=0) return "step "+(i+1)+" of "+DATA.pipeline.length+" in the pipeline";
  return "the shared vocabulary";
}
function syncLevelBtns(){
  document.querySelectorAll(".lvl").forEach(b=>b.classList.toggle("active", +b.dataset.lvl===curLevel));
  const h=$("#lvlHint"); if(h) h.textContent=LEVELS[curLevel].hint;
}
function mdInline(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/`([^`]+)`/g,'<code>$1</code>');
}
function renderLevel(file){
  const ex = $("#explainBox"); if(!ex) return;
  const txt = file[LEVELS[curLevel].key] || "—";
  ex.classList.remove("swap"); void ex.offsetWidth; ex.classList.add("swap");
  ex.innerHTML = mdInline(txt);
  const fill = document.querySelector(".depth-fill");
  if (fill){ fill.style.width = ((curLevel+1)/3*100)+"%"; fill.style.background = "var("+LVAR[curLevel]+")"; }
}

/* ---- home / overview ---- */
function openHome(){
  curFile=null; markFlow(null);
  document.querySelectorAll(".file-item").forEach(li=>li.classList.remove("active"));
  const d=$("#detail"); d.innerHTML="";
  d.appendChild(el("div","crumb","the whole engine, top to bottom"));
  d.appendChild(el("h1","title","How the map gets drawn"));
  const lead = el("p","ov-lead");
  lead.innerHTML = "This program turns raw historical data into an interactive globe of the ancient Near East across time. The work flows through eight small Rust libraries, each with one job. Start anywhere — pick a crate below, then a file, and dial the depth from plain-English up to the real internals.";
  d.appendChild(lead);
  const grid = el("div","ov-grid");
  orderedCrates().forEach((cr,idx)=>{
    const info=DATA.crates[cr]; if(!info) return;
    const isBase=DATA.base.includes(cr);
    const card=el("button","ov-card");
    const top=el("div","oc-top");
    top.appendChild(el("span","crate-idx"+(isBase?" base":""), isBase?"∗":String(idx+1)));
    top.appendChild(el("span","oc-name",cr));
    top.appendChild(el("span","oc-count",(info.files.length)+" files"));
    card.appendChild(top);
    card.appendChild(el("div","oc-role", CRATE_BLURB[cr]||info.role||""));
    card.addEventListener("click",()=>openCrate(cr));
    grid.appendChild(card);
  });
  d.appendChild(grid);
  const foot=el("div","foot");
  foot.innerHTML = "The arrows at the top are the real data pipeline: each crate hands its work to the next. <b>map-types</b> sits underneath them all — it's the shared vocabulary every crate imports.";
  d.appendChild(foot);
  window.scrollTo({top:0,behavior:"smooth"});
}
function openCrate(cr){
  const info=DATA.crates[cr]; if(!info) return;
  // open the group, select its first file
  buildTree($("#search").value);
  const grp=[...document.querySelectorAll(".crate-group")].find(g=>g.querySelector(".crate-name")?.textContent===cr);
  if (grp){ grp.classList.remove("collapsed"); grp.scrollIntoView({block:"nearest"}); }
  if (info.files[0]) openFile(info.files[0].path);
}

/* ---- theme ---- */
function initTheme(){
  let t=null; try{ t=localStorage.getItem("atlas.theme"); }catch{}
  if (t) document.documentElement.setAttribute("data-theme",t);
  $("#themeBtn").addEventListener("click",()=>{
    const cur=document.documentElement.getAttribute("data-theme");
    const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
    const next=isDark?"light":"dark";
    document.documentElement.setAttribute("data-theme",next);
    try{localStorage.setItem("atlas.theme",next)}catch{}
  });
}

$("#search").addEventListener("input",e=>buildTree(e.target.value));
$("#expandAll").addEventListener("click",()=>{
  const anyCollapsed=[...document.querySelectorAll(".crate-group")].some(g=>g.classList.contains("collapsed"));
  document.querySelectorAll(".crate-group").forEach(g=>{
    g.classList.toggle("collapsed", !anyCollapsed);
    const nm=g.querySelector(".crate-name")?.textContent;
    try{ if(nm) localStorage.setItem("atlas.collapse."+nm, !anyCollapsed?"1":"0"); }catch{}
  });
  $("#expandAll").textContent = anyCollapsed ? "Collapse all" : "Expand all";
});

buildFlow(); buildTree(); initTheme(); openHome();
</script>
</body>
</html>
