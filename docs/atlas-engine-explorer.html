<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Atlas Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#ECEEE9; --panel:#FBFBF8; --sunk:#E3E6E0; --raise:#FFFFFF;
    --ink:#18201F; --ink-soft:#48534F; --ink-faint:#727E79;
    --rule:#D2D8D1; --rule-soft:#E0E4DD;
    --water:#0F6068; --water-2:#128089; --land:#9C7638; --plum:#6A5B93;
    --good:#2E6B4F;
    --shadow:0 1px 2px rgba(20,30,28,.05), 0 10px 30px rgba(20,30,28,.06);
    --l1:#0F6068; --l2:#9C7638; --l3:#6A5B93;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#121618; --panel:#1A2022; --sunk:#232A2C; --raise:#20282A;
      --ink:#E7ECE9; --ink-soft:#A8B4B0; --ink-faint:#7C8884;
      --rule:#2C3437; --rule-soft:#222A2C;
      --water:#4FBAC4; --water-2:#63C8D1; --land:#D8B478; --plum:#AE9FD6;
      --good:#6FBF93;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
      --l1:#4FBAC4; --l2:#D8B478; --l3:#AE9FD6;
    }
  }
  :root[data-theme="dark"]{
    --paper:#121618; --panel:#1A2022; --sunk:#232A2C; --raise:#20282A;
    --ink:#E7ECE9; --ink-soft:#A8B4B0; --ink-faint:#7C8884;
    --rule:#2C3437; --rule-soft:#222A2C;
    --water:#4FBAC4; --water-2:#63C8D1; --land:#D8B478; --plum:#AE9FD6;
    --good:#6FBF93;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.28);
    --l1:#4FBAC4; --l2:#D8B478; --l3:#AE9FD6;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:var(--water-2)}
  code,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}

  /* ---------- header ---------- */
  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--rule);
  }
  .head-row{
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
    padding:14px clamp(14px,3vw,26px) 10px;
  }
  .brand{font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:1.5rem; letter-spacing:-.01em; line-height:1}
  .brand .dot{color:var(--water)}
  .tagline{color:var(--ink-soft); font-size:.86rem; max-width:52ch}
  .head-actions{margin-left:auto; display:flex; gap:8px; align-items:center}
  .tbtn{
    font:inherit; font-size:.78rem; color:var(--ink-soft); cursor:pointer;
    background:var(--panel); border:1px solid var(--rule); border-radius:8px; padding:6px 10px;
  }
  .tbtn:hover{color:var(--ink); border-color:var(--water)}

  /* ---------- pipeline flow ---------- */
  .flow{
    display:flex; align-items:stretch; gap:0; flex-wrap:wrap;
    padding:0 clamp(14px,3vw,26px) 12px;
  }
  .flow-node{
    display:flex; align-items:center; gap:0;
  }
  .flow-chip{
    font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.01em;
    color:var(--ink-soft); background:var(--panel); border:1px solid var(--rule);
    border-radius:7px; padding:5px 9px; cursor:pointer; white-space:nowrap;
    transition:border-color .12s, color .12s, background .12s;
  }
  .flow-chip:hover{color:var(--ink); border-color:var(--water)}
  .flow-chip.active{color:var(--raise); background:var(--water); border-color:var(--water)}
  :root[data-theme="dark"] .flow-chip.active,
  :root:not([data-theme="light"]) .flow-chip.active{color:#0c1113}
  @media (prefers-color-scheme: light){ .flow-chip.active{color:#fff} }
  .flow-arrow{color:var(--ink-faint); font-size:.8rem; padding:0 6px; align-self:center}
  .flow-base{
    margin-top:8px; width:100%; display:flex; align-items:center; gap:8px;
    font-size:.72rem; color:var(--ink-faint);
  }
  .flow-base .flow-chip{border-style:dashed}

  /* ---------- layout ---------- */
  .wrap{
    display:grid; grid-template-columns:clamp(220px,24vw,280px) 1fr;
    gap:0; align-items:start;
  }
  @media (max-width:760px){ .wrap{grid-template-columns:1fr} }

  /* ---------- sidebar ---------- */
  aside{
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 116px);
    align-self:start; max-height:calc(100vh - 130px); overflow-y:auto;
    border-right:1px solid var(--rule); padding:14px 10px 40px clamp(14px,3vw,26px);
  }
  @media (max-width:760px){
    aside{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--rule)}
  }
  .search{
    width:100%; font:inherit; font-size:.85rem; color:var(--ink);
    background:var(--sunk); border:1px solid var(--rule); border-radius:9px;
    padding:8px 10px; margin-bottom:12px;
  }
  .search::placeholder{color:var(--ink-faint)}
  .search:focus{outline:2px solid var(--water); outline-offset:1px; border-color:transparent}
  .crate-group{margin-bottom:6px}
  .crate-head{
    display:flex; align-items:center; gap:8px; width:100%;
    background:none; border:0; cursor:pointer; text-align:left;
    padding:7px 6px; border-radius:7px; color:var(--ink);
  }
  .crate-head:hover{background:var(--sunk)}
  .crate-idx{
    font-family:"IBM Plex Mono",monospace; font-size:.66rem; color:var(--raise);
    background:var(--water); border-radius:5px; width:18px; height:18px;
    display:grid; place-items:center; flex:0 0 18px;
  }
  :root[data-theme="dark"] .crate-idx, :root:not([data-theme="light"]) .crate-idx{color:#0c1113}
  @media (prefers-color-scheme: light){ .crate-idx{color:#fff} }
  .crate-idx.base{background:var(--ink-faint)}
  .crate-name{font-family:"IBM Plex Mono",monospace; font-size:.82rem; font-weight:500; flex:1}
  .crate-caret{color:var(--ink-faint); font-size:.7rem; transition:transform .15s}
  .crate-group.collapsed .crate-caret{transform:rotate(-90deg)}
  .crate-group.collapsed .file-list{display:none}
  .file-list{list-style:none; margin:2px 0 8px; padding:0 0 0 8px}
  .file-item{
    display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
    font-size:.82rem; color:var(--ink-soft); padding:5px 8px; border-radius:6px;
    border-left:2px solid transparent; line-height:1.3;
  }
  .file-item:hover{background:var(--sunk); color:var(--ink)}
  .file-item.active{color:var(--ink); background:var(--sunk); border-left-color:var(--water); font-weight:500}
  .file-item .fi-path{font-family:"IBM Plex Mono",monospace; font-size:.68rem; color:var(--ink-faint); display:block}

  /* ---------- detail ---------- */
  main{padding:22px clamp(16px,4vw,44px) 80px; min-width:0; max-width:900px}
  .crumb{
    font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-faint);
    margin-bottom:6px;
  }
  .crumb b{color:var(--water-2); font-weight:500}
  .title{
    font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:clamp(1.7rem,4vw,2.4rem);
    line-height:1.08; letter-spacing:-.015em; margin:0 0 6px; text-wrap:balance;
  }
  .filepath{font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--land); margin-bottom:14px; word-break:break-all}
  .role{
    font-size:1.06rem; color:var(--ink-soft); line-height:1.5; margin:0 0 22px;
    padding-left:14px; border-left:2px solid var(--rule); max-width:64ch;
  }

  /* level control */
  .levels{
    display:flex; gap:4px; background:var(--sunk); border:1px solid var(--rule);
    border-radius:11px; padding:4px; margin:0 0 4px; width:fit-content; max-width:100%;
    flex-wrap:wrap;
  }
  .lvl{
    font:inherit; font-size:.8rem; cursor:pointer; border:0; background:none;
    color:var(--ink-soft); padding:7px 13px; border-radius:8px; display:flex; align-items:center; gap:8px;
    transition:background .12s, color .12s;
  }
  .lvl:hover{color:var(--ink)}
  .lvl.active{background:var(--raise); color:var(--ink); box-shadow:var(--shadow)}
  .lvl .pips{display:inline-flex; gap:2px}
  .lvl .pip{width:5px; height:5px; border-radius:50%; background:var(--ink-faint); opacity:.4}
  .lvl[data-lvl="0"] .pip:nth-child(-n+1),
  .lvl[data-lvl="1"] .pip:nth-child(-n+2),
  .lvl[data-lvl="2"] .pip:nth-child(-n+3){opacity:1}
  .lvl[data-lvl="0"].active .pip:nth-child(-n+1){background:var(--l1)}
  .lvl[data-lvl="1"].active .pip:nth-child(-n+2){background:var(--l2)}
  .lvl[data-lvl="2"].active .pip:nth-child(-n+3){background:var(--l3)}
  .lvl-hint{font-size:.75rem; color:var(--ink-faint); margin:8px 2px 18px}

  .explain{
    font-size:1.06rem; line-height:1.68; color:var(--ink); max-width:66ch;
    margin:0 0 30px; min-height:3em;
  }
  .explain.swap{animation:fade .28s ease}
  @keyframes fade{from{opacity:0; transform:translateY(3px)} to{opacity:1; transform:none}}
  .explain code{background:var(--sunk); padding:.08em .36em; border-radius:5px; font-size:.86em; color:var(--water-2)}

  .depth-rail{height:3px; border-radius:2px; background:var(--sunk); overflow:hidden; margin:0 0 30px; max-width:66ch}
  .depth-fill{height:100%; background:var(--l1); transition:width .28s ease, background .28s ease}

  .keys-h{
    font-family:"IBM Plex Sans"; font-size:.72rem; text-transform:uppercase; letter-spacing:.1em;
    color:var(--ink-faint); margin:0 0 12px; display:flex; align-items:center; gap:10px;
  }
  .keys-h::after{content:""; flex:1; height:1px; background:var(--rule)}
  .keys{display:grid; gap:2px; margin:0 0 10px}
  .key{
    display:grid; grid-template-columns:minmax(0,auto) 1fr; gap:14px; align-items:baseline;
    padding:9px 12px; border-radius:8px;
  }
  .key:nth-child(odd){background:var(--panel)}
  .key .kname{font-family:"IBM Plex Mono",monospace; font-size:.82rem; color:var(--water-2); font-weight:500; word-break:break-word}
  .key .kdesc{color:var(--ink-soft); font-size:.9rem}
  @media (max-width:520px){ .key{grid-template-columns:1fr; gap:2px} }

  /* overview (home) */
  .ov-lead{font-size:1.14rem; line-height:1.6; color:var(--ink-soft); max-width:64ch; margin:0 0 26px}
  .ov-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; margin:0 0 30px}
  .ov-card{
    background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:14px 15px;
    cursor:pointer; text-align:left; transition:border-color .12s, transform .12s;
  }
  .ov-card:hover{border-color:var(--water); transform:translateY(-2px)}
  .ov-card .oc-top{display:flex; align-items:center; gap:9px; margin-bottom:8px}
  .ov-card .oc-name{font-family:"IBM Plex Mono",monospace; font-weight:500; font-size:.9rem}
  .ov-card .oc-role{font-size:.9rem; color:var(--ink-soft); line-height:1.5}
  .ov-card .oc-count{margin-left:auto; font-size:.7rem; color:var(--ink-faint); font-family:"IBM Plex Mono",monospace}

  .foot{color:var(--ink-faint); font-size:.8rem; margin-top:40px; padding-top:16px; border-top:1px solid var(--rule); max-width:66ch}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <div class="brand">The Atlas Engine<span class="dot">.</span></div>
    </div>
    <div class="tagline">A guided tour of the Rust that draws the map — every crate and file, explained from scratch, as deep as you want to go.</div>
    <div class="head-actions">
      <button class="tbtn" id="expandAll">Expand all</button>
      <button class="tbtn" id="themeBtn">◐ Theme</button>
    </div>
  </div>
  <div class="flow" id="flow"></div>
</header>

<div class="wrap">
  <aside>
    <input class="search" id="search" placeholder="Find a file or crate…" autocomplete="off" spellcheck="false">
    <div id="tree"></div>
  </aside>
  <main id="detail"></main>
</div>

<script>
/* __DATA__ */
const DATA = {"pipeline": ["map-adapters", "map-partition", "map-compile", "map-canon", "map-provider", "map-encoders", "map-viewer"], "base": ["map-types"], "crates": {"map-adapters": {"role": "The data-ingest edge of the atlas: each module in this crate turns one external source's raw bytes (historical-basemaps GeoJSON, Natural Earth coastlines, ETOPO elevation grids, a hand-traced reference plate, authored Bible surveys, or the sibling atlas repo's chronology/gazetteer exports) into the shared map-types vocabulary (WorldTimeline, Region, Boundary, ChangeEvent). Every adapter obeys the same 'fidelity' law: what came out must be provably recoverable from what went in, and anything skipped or approximated is a typed, counted, disclosed exemption rather than a silent guess.", "files": [{"path": "crates/map-adapters/src/lib.rs", "title": "Adapters crate root", "role": "Declares every adapter submodule and re-exports their public functions/types as the crate's one front door.", "newbie": "This file is basically a table of contents. In Rust, a crate (a package of code) is built from many files called modules, and `lib.rs` is the file that lists which modules exist and which of their pieces the outside world is allowed to use. Think of it like the index page of a toolbox: it doesn't do any work itself, it just says 'the wrench is in drawer 3, the screwdriver in drawer 5' so other code can find things.", "intermediate": "`pub mod arcs;` etc. declare each source file (arcs.rs, basemaps.rs, surveys.rs, ...) as part of this crate. `pub use` lines then re-export specific items (functions like `ingest`, types like `HistoricalBasemaps`) so callers can write `map_adapters::ingest(...)` instead of reaching into `map_adapters::basemaps::ingest(...)`. The doc comment at the top states the crate's guiding law in one word: FIDELITY — an adapter's whole job is converting one source's bytes into a lawful `WorldTimeline` without inventing anything.", "advanced": "The re-exports define the crate's actual public API surface, independent of its file layout — a later refactor that splits or merges modules doesn't break callers as long as these `pub use` lines are kept stable. The `TimelineSource` trait (re-exported from basemaps.rs) is called out in the doc comment as 'the seam': any future adapter that implements `fn source() -> SourceId` and `fn ingest() -> Result<Ingest, IngestError>` can be swapped in without downstream code noticing, which is the whole point of programming against an interface/trait rather than a concrete type.", "key_items": ["pub mod declarations — one per adapter source file", "pub use re-exports — the crate's real public API", "TimelineSource trait — the swappable-adapter seam", "fidelity_violations — the phase-2 correctness law, re-exported here"]}, {"path": "crates/map-adapters/src/basemaps.rs", "title": "Historical basemaps ingest", "role": "Turns a stack of historical-basemaps GeoJSON files (one per epoch, e.g. 'world_bc2000') into a WorldTimeline of regions, shared boundaries, and narrated change events.", "newbie": "Imagine a flipbook where each page is a map of the whole world at one moment in history (2000 BC, 1500 BC, and so on). This file reads every page, figures out which countries appeared, disappeared, or had their borders move between pages, and writes that story down as structured data instead of just leaving you with a stack of unconnected pictures.", "intermediate": "`EpochSource` holds one epoch's year and raw text; `IngestConfig` carries the source id, an optional `Anchor` (a cutoff before which epochs are dropped), and a coordinate `snap` tolerance. `build_epoch` parses each epoch's GeoJSON features into named region outlines, then calls into `arcs::extract` to turn duplicate borders between neighboring regions into shared pieces. `ingest()` walks the sorted epochs, builds a `BoundaryHistory` per shared arc and a `RegionHistory` per named region (each as runs of consecutive identical geometry), and emits `Rise`/`Fall`/`Shift` `ChangeEvent`s wherever a region newly appears, disappears, or its border-arc set changes between consecutive epochs.", "advanced": "`fn ingest(config: &IngestConfig, epochs: &[EpochSource]) -> Result<Ingest, IngestError>` is the main entry point; its companion `fidelity_violations(ingest: &Ingest, epoch: &EpochSource) -> Result<Vec<String>, IngestError>` is the crate's proof obligation — it re-parses the same source text, re-quantizes it the same way, and checks that every stored region's geometry at that epoch's `TimePoint` reconstructs ring-for-ring (comparing canonicalized bit-patterns of unit vectors via `rotate_min`) against what the raw source actually said. Change detection uses `arc_set`/`same_geometry`, which compares the *multiset* of boundary-arc IDs+orientations rather than structural equality, so two epochs that list the same border in a different part order are correctly treated as unchanged. Every excluded feature (unnamed, pre-anchor, or degenerate-after-quantization) becomes a counted `Exemption` variant rather than being dropped silently.", "key_items": ["EpochSource / IngestConfig / Exemption — one epoch's input, its ingest knobs, its typed skip-reasons", "ingest() — the epoch-to-WorldTimeline pipeline", "fidelity_violations() — proves stored geometry equals the source, ring for ring", "same_geometry()/arc_set() — the change detector that ignores part-order, not just literal equality", "TimelineSource trait impl on HistoricalBasemaps — the adapter's public contract"]}, {"path": "crates/map-adapters/src/hydro.rs", "title": "Hydrography (seas, lakes, and the world ocean)", "role": "Ingests Natural Earth water-body GeoJSON into first-class Water-class regions, including a spherically-honest global ocean built as 'the sphere minus the land'.", "newbie": "The owner's rule is 'we care about oceans too' — water shouldn't just be blank background paint, it should be a clickable, explorable region just like a country. This file reads coastline data and turns lakes, seas, and the ocean into real map regions with names and borders, the same way a country gets a name and a border.", "intermediate": "`ingest_water` reads one or more `WaterSource`s (each a GeoJSON blob plus a fallback label for unnamed features, e.g. the world ocean file's giant unnamed polygon) and produces `RegionClass::Water` regions, merging same-named features (a lake split across two polygons) into one multi-part region. `ingest_ocean` takes a different, more careful approach for the world's ocean: rather than trusting the ocean file's own polygon (which is a degenerate pole-and-antimeridian-stitched shape on a sphere), it builds 'the sea' as a single region whose only part is an empty outer cycle with every land outline as a hole — meaning the ocean is defined as 'everywhere that isn't land,' derived, not drawn.", "advanced": "The land-as-holes trick means the exact same `BoundaryId` boundaries used as land's own outer cycles are reused as the sea's holes — content-addressing (hashing coordinates into a `BoundaryId`) makes coast and shore the same line by construction, so there is never a sliver gap between land and sea. Every water region's `Justification` cites `Ground::Scripture` (Genesis 1:9-10, 'the gathering together of the waters called he Seas') alongside `Ground::Source`, explicitly disclosing that the DATE claim is Scripture's while the SHAPE is modern coastline data — the file's provenance string spells this out verbatim so no downstream consumer can conflate the two kinds of authority.", "key_items": ["WaterSource — one dataset plus its unnamed-feature label and 'skip largest feature' flag", "ingest_water() — named lakes/seas as ordinary Water regions", "ingest_ocean() — the whole-sphere-minus-land ocean, land outlines reused as its holes", "Justification mixing Ground::Scripture (the date) and Ground::Source (the shape)"]}, {"path": "crates/map-adapters/src/terrain.rs", "title": "Relief bands via marching squares", "role": "Contours a public-domain global elevation grid into hypsometric (elevation-banded) regions — hills, uplands, highlands, mountains, high peaks — each a first-class, clickable Terrain region.", "newbie": "Picture a topographic map with contour lines showing 'everything above 1000 meters.' This file draws those lines automatically from a grid of elevation numbers (like a giant spreadsheet of heights across the globe), using a classic image-processing trick called 'marching squares' that looks at four neighboring grid points at a time and decides where a contour line should pass through that little square.", "intermediate": "`ElevationGrid` is a simple row-major array of 16-bit elevations (loaded from a vendored ETOPO binary at quarter-degree resolution). `contour_rings(grid, threshold)` runs marching squares: for every 2x2 cell of grid points it looks at which corners are above the threshold (a 4-bit `case` from 0-15), decides which edges of the cell a line segment should cross, and chains those segments edge-to-edge into closed rings. `ingest_terrain` runs this once per band in the `BANDS` constant (200m, 500m, 1000m, 2000m, 3500m) and stores each band's rings as one `RegionClass::Terrain(band)` region.", "advanced": "The 16 marching-squares cases are handled explicitly via a match, with cases 5 and 10 (the 'saddle' ambiguity, where the cell is above-below-above-below diagonally) resolved by comparing the four corners' average against the threshold — a standard, deterministic tie-break rather than an arbitrary default. Segments are stored directed (`next: BTreeMap<EdgeKey, (EdgeKey, ...)>`) so that the 'above' side is always on the left, which is what makes every properly-closed chain traversal produce a consistent ring; a chain that fails to close (`closed == false`) is dropped rather than patched, and short rings (fewer than 8 points) are discarded as noise. Grid queries out-of-bounds return -30000.0, an arbitrarily-low sentinel that guarantees contours close cleanly at the grid's edge instead of leaking off it.", "key_items": ["ElevationGrid::from_etopo_bin — loads the vendored 721x1441 quarter-degree grid", "contour_rings() — marching squares over threshold, saddle cases resolved by corner average", "BANDS — the five hypsometric thresholds and their labels", "ingest_terrain() — one Terrain-class region per band, valid from Genesis 1:9's date"]}, {"path": "crates/map-adapters/src/plate_water.rs", "title": "Traced plate water geometry", "role": "Stores hand-traced pixel coordinates for the owner's reference map ('the plate') water bodies and rivers, and converts them into sphere coordinates through a calibrated pixel-to-globe chart.", "newbie": "The owner has a physical/reference map image ('the plate'), and someone traced the outlines of its seas, lakes, and rivers by hand in pixel coordinates (like tracing over a photo in an image editor). This file holds all those traced pixel points as long constant lists, plus a formula (a 'chart') that was calibrated against 12 known city locations so it can convert 'pixel (2824, 0)' into 'this point on the globe' accurately.", "intermediate": "`plate_chart()` builds a `Chart` — an affine (straight-line, no distortion) transform fit over 12 detected city dots, with a disclosed mean error of about 1.6 km. Dozens of `const PLATE_AREA_*` / `PLATE_RIVER_*` / `PLATE_JORDAN_*` arrays hold the raw traced pixel coordinates (areas as closed rings, rivers as open polylines, plus lower-resolution '_PATH_' variants used just for overlay display). `plate_water_timeline()` runs each area through the chart via `chart.to_sphere(x, y)` and builds `Water`-class regions (the Great Sea, the Jordan's waters, the interior rivers) the same way the other adapters do — boundaries plus regions plus a Scripture-grounded justification.", "advanced": "`Chart::new` takes a 2x2 linear matrix, an offset, and a pixel-space bounding box, and `to_sphere` maps a pixel `(x, y)` to a `UnitVec` — this is the one function in the whole crate that turns 'a point on a traced image' into 'a point on the actual 3D globe,' so every coordinate here is described as a *tracing marker*, never an authoritative place claim. `plate_water_witnesses()` and `plate_river_paths()` expose the same traced geometry as raw `Vec<UnitVec>` polylines (not full WorldTimeline regions) for the partition builder to use as reference/overlay data — a second consumer of the same source-of-truth constants, so the traced points are never duplicated or re-typed by hand.", "key_items": ["plate_chart() — the calibrated pixel-to-sphere affine Chart (12 city dots, ~1.6 km residual)", "PLATE_AREA_* / PLATE_RIVER_* / PLATE_JORDAN_* — the raw hand-traced pixel coordinate constants", "plate_water_timeline() — traced areas as Water-class WorldTimeline regions", "plate_water_witnesses() / plate_river_paths() — the same geometry exposed as raw sphere polylines for overlays"]}, {"path": "crates/map-adapters/src/arcs.rs", "title": "Shared-arc extraction", "role": "Finds border stretches that two or more input rings actually share (exact vertex agreement) and stores each shared stretch exactly once instead of once per neighbor.", "newbie": "When a data source describes two neighboring countries, it usually gives each one its own complete outline — which means the border between them gets stored twice, once from each side. This file is the 'shared fence' logic: it notices when two outlines run along the exact same points and stores that shared stretch only once, so the map doesn't waste space (or risk the two copies drifting apart) on borders that are really one line.", "intermediate": "`extract(rings: &[Vec<QPoint>]) -> Extraction` first counts, for every edge in every ring, which ring indices ('users') walk over it. It finds 'junctions' — vertices where the set of users changes — and splits each ring into runs between junctions; each run becomes one shared 'arc.' A ring with no junctions at all (an isolated shape sharing nothing) becomes one arc that closes on itself. `Extraction` bundles the deduplicated arc list plus, per input ring, the ordered walk of `(arc index, direction)` pairs whose concatenation reproduces that ring.", "advanced": "Canonicalization is key to correctness: `intern()` picks the lexicographically smaller of a walked arc and its reverse so that two rings sharing a border from opposite directions land on the identical stored arc; the closed-ring special case additionally minimizes over every rotation (`canonical_rotation`) as well as both directions, since a fully-shared ring has no fixed starting point. `reconstruct_ring()` is the fidelity witness used by `basemaps::fidelity_violations`: it rebuilds a ring from its cycle by concatenating each arc's points (minus the trailing junction point, which the next arc owns), and the invariant the whole module guarantees is 'every input ring is exactly the concatenation of its extracted arcs' — the crate's fidelity law depends on this holding exactly, not approximately.", "key_items": ["extract() — junction-based arc splitting and cycle recording", "intern() — canonical direction choice so opposite-direction sharers still match", "canonical_rotation (via quantize.rs) — handles the closed-ring, no-junction case", "reconstruct_ring() — the fidelity witness rebuilding a ring from its arcs"]}, {"path": "crates/map-adapters/src/geojson.rs", "title": "GeoJSON feature parsing", "role": "The single place in the crate that understands raw GeoJSON text; everything downstream works only with the typed SourceFeature/SourcePolygon it produces.", "newbie": "Data files on disk are just text (in this case, JSON — a common way to write structured data as readable text). This file is the translator: it reads that text and turns it into proper Rust data structures (typed 'boxes' with named fields) that the rest of the program can work with safely, instead of every other file having to re-parse raw text itself.", "intermediate": "`parse_features(text: &str) -> Result<Vec<SourceFeature>, ParseError>` walks a GeoJSON FeatureCollection's `features` array; for each feature it reads a name (`NAME` or lowercase `name` property), an optional `BORDERPRECISION` honesty signal, and its geometry — accepting `Polygon` or `MultiPolygon` and rejecting anything else as a shape error, since 'this source is a border atlas.' `ring()` and `polygon()` are small helpers that turn raw JSON arrays into `Vec<(f64, f64)>` lon/lat pairs and `SourcePolygon { outer, holes }`.", "advanced": "The module's doc comment invokes 'terminality' discipline (Law 11): output formats belong at the encoder edge, but the same discipline applies inward — nothing downstream of this file is allowed to touch raw JSON or text parsing again, which keeps the parsing logic in exactly one auditable place. `ParseError` distinguishes `BadSyntax` (invalid JSON) from `BadShape` (valid JSON that doesn't match the expected feature-collection shape), and the `precision: Option<i64>` field is explicitly never reinterpreted — it's carried through to justifications verbatim as 'the source's own honesty signal,' preserving the source's self-reported confidence rather than the adapter guessing at it.", "key_items": ["SourceFeature / SourcePolygon — the typed shape every other adapter consumes", "parse_features() — the one GeoJSON-to-typed-struct conversion in the crate", "ParseError::BadSyntax vs BadShape — invalid JSON vs wrong-shaped JSON", "precision (BORDERPRECISION) — carried through verbatim, never reinterpreted"]}, {"path": "crates/map-adapters/src/exports.rs", "title": "Atlas exports adapter (C2/C3 authority import)", "role": "Parses the sibling atlas repository's chronology and gazetteer export files into an AtlasExports struct, which becomes the authoritative source of dates and place coordinates that the Bible-survey adapter binds against.", "newbie": "There's a separate project (the 'atlas') that is the trusted authority on when biblical events happened and where places were located. This file reads that project's exported data files (plain JSON) and loads them into memory so the map can ask, 'what year did this event actually happen, according to the atlas?' instead of guessing on its own.", "intermediate": "`load_exports(gazetteer_text, chronology_text)` parses both files, checks they share the same `atlas_version_root` hash (they must come from one consistent atlas build, or it's a `RootMismatch` error), and builds an `AtlasExports` with a place-name index and a list of dated `AtlasEvent`s. `AtlasExports::resolve_place(name)` looks up a place by its canonical name or alias (case-insensitively, and after stripping a parenthetical like '(Baalah)'). `AtlasExports::resolve_event(book, from, to)` finds the atlas event whose attested Bible verses best overlap a given verse range.", "advanced": "`resolve_event`'s ambiguity rule is deliberately conservative: it counts, per candidate event, how many of its attested verses fall inside the requested `[book, from]..[book, to]` range, keeps the highest-hit-count candidate, but returns `None` (unbound) rather than an arbitrary winner if two events tie — 'ambiguity left unbound rather than guessed' per the module's own doc comment. `parse_locus` decodes strings like `\"2KI.5.12\"` against a 66-book `BOOKS` array whose index+1 is the numeric book id the rest of the codebase's `VerseRef` expects. The whole module enforces a one-directional authority rule stated in the header comment: 'atlas -> map; nothing here re-derives or re-dates' — this file only ever reads and trusts, never recomputes, the atlas's own conclusions.", "key_items": ["load_exports() — parses+validates gazetteer/chronology, enforces matching atlas_version_root", "AtlasExports::resolve_place() — canonical-name-first, alias-as-fallback lookup", "AtlasExports::resolve_event() — verse-overlap binding with tie-means-unbound", "parse_locus() / BOOKS — KJV book-abbreviation to (book, chapter, verse) decoding"]}, {"path": "crates/map-adapters/src/quantize.rs", "title": "Coordinate quantization", "role": "Snaps floating-point longitude/latitude coordinates onto a fixed integer grid so that vertices which are 'supposed to' coincide actually compare bit-for-bit equal.", "newbie": "Computers store fractional numbers (like 35.123456789) in a way that makes exact comparison risky — two numbers that should be 'the same point' can end up very slightly different after math, like two rulers that are almost but not quite lined up. This file rounds every coordinate to a fixed, very fine grid (about one centimeter per step) so that points which the data intends to be identical really are identical, letting later code compare them with ordinary equality instead of fuzzy 'close enough' checks.", "intermediate": "`QPoint` stores longitude and latitude as `i64` integers counted in ten-millionths of a degree (`GRID = 1e7`). `clean_ring(src, snap)` converts a source ring's floating-point points to `QPoint`s, optionally pre-rounding to a coarser `snap` grid first, drops consecutive duplicate points, drops a redundant closing point if the ring repeats its first point at the end, and returns `None` if fewer than 3 points remain (a degenerate ring). `canonical_rotation(pts)` rotates a ring's point list to start at its lexicographically smallest rotation, so two different traversals of 'the same ring' compare as identical lists.", "advanced": "The grid resolution (1e-7 degrees, roughly 1 cm at the equator) is chosen to be four orders of magnitude finer than the source data's own precision, which is why the module's doc comment can claim 'vertices that agree in the source text agree exactly as integers' — quantization here is a no-op for genuinely-matching data, only affecting numerical noise. The separate `snap` parameter (used with a much coarser tolerance, e.g. in `basemaps::IngestConfig`) is a distinct, disclosed 'topology-closure' knob: it deliberately merges near-miss vertices across a wider tolerance so neighboring polygons whose borders don't quite meet in the raw data are forced to close up, and this is always recorded as data (never silently baked in) so a fidelity check can compare against the source 'as snapped.'", "key_items": ["QPoint — lon/lat quantized to 1e-7-degree integers", "clean_ring() — quantize, dedup, drop degenerate rings (<3 points)", "canonical_rotation() — rotates a ring to a canonical starting point for equality checks", "snap parameter — a separate, disclosed, coarser topology-closure tolerance"]}, {"path": "crates/map-adapters/src/surveys.rs", "title": "Scripture-derived borders (surveys, kingdoms, journeys)", "role": "The largest and most narrative adapter: encodes literal Bible border surveys (Numbers 34), authored nation and kingdom-era territory hulls, and Scripture's journey itineraries (Abraham, the Exodus, Paul's voyages) as WorldTimeline data, every shape grounded in cited verses and every date under the traditional (Ussher) chronology unless the real atlas authority overrides it.", "newbie": "Picture turning sentences like 'the border went from the Salt Sea, to the ascent of Akrabbim, to the wilderness of Zin...' (Numbers 34) into actual dots-and-lines on a map. This file is that translation for dozens of Bible passages — border descriptions, family/nation homelands from Genesis 10, kingdoms that rose and fell, and travel routes like Paul's missionary journeys — where every dot traces back to a specific verse, and every dot's exact map coordinates are disclosed as either a real archaeological identification or an honest 'best guess, pending better data.'", "intermediate": "A `Waypoint` is just a name plus a stand-in lat/lon; huge `const` arrays like `NUM_34_CIRCUIT`, `N_CANAAN`, `UNITED_SOLOMONIC`, and the very long `PLATE_CANAAN_CONTOUR` hold these waypoints for each surveyed border, nation, kingdom phase, or journey. Three parallel 'spec' structs — `SurveySpec` (a border/homeland), `EraSpec`/`PhaseSpec` (a kingdom whose territory changes over named phases), and `RouteSpec` (an open journey) — bundle a circuit with its verse citation, its traditional year, and metadata about how honestly the shape is known. `add_survey`/`add_era`/`add_route` are the builder functions that turn one spec into `Boundary`/`Region`/`ChangeEvent` entries in a `WorldTimeline`, and `resolve_circuit()` is called by all three: it tries to bind each waypoint to the real atlas gazetteer (getting a precise coordinate and PlaceId) and otherwise falls back to the stand-in coordinate baked into the `Waypoint`.", "advanced": "Two small enums encode judgment calls that the codebase refuses to leave as silent defaults: `Holds` (`Ground(&str)` — possessed, administered territory, with its justification written inline — vs `Claim`, a promise/vision/homeland hull that never fills as territory) and `Stands` (`Until(year)` vs `Enduring(&str)`, where reaching the frame's edge requires a written reason so the canon's frame-edge validator can check it). `Grade` (`BorderText` vs `CityDerived`) controls whether a boundary renders as a confident `Line` or a disclosed-approximate `Unknown` hull. `resolve_event()`'s tie-breaking (best-hit-count, ambiguous ties left unbound) flows through from exports.rs into `add_survey`/`add_era`/`add_route`, which additionally guard against a bound date breaking an era's phase ordering (`years[i].0 <= years[i-1].0` is detected and the binding is dropped rather than accepted). `binding_report()` is a genuinely clever dividend of this design: because every survey/era/route carries its own independent traditional-year guess *and* can resolve against the atlas, comparing the two for every entry is a free, automatically-recomputed audit of whether the atlas's own chronology agrees with the historic Ussher tradition this file encodes.", "key_items": ["SurveySpec / EraSpec+PhaseSpec / RouteSpec — the three declarative shapes (border, changing kingdom, journey)", "Holds / Stands / Grade — declared-in-writing metadata for tenure, endurance, and shape-honesty", "resolve_circuit() — binds each waypoint to the real atlas gazetteer, or keeps the stand-in coordinate", "add_survey() / add_era() / add_route() — spec-to-WorldTimeline builders", "scripture_timeline_with(Option<&AtlasExports>) — the one builder used both with and without real atlas data", "binding_report() — a free chronology audit comparing stand-in years against atlas-bound years"]}]}, "map-partition": {"role": "map-partition turns messy, possibly-overlapping hand-traced shapes ('witnesses') into one mathematically clean spherical map: every border drawn exactly once, every patch of the globe accounted for, nothing missing or doubled. It is the geometry engine beneath the atlas - it doesn't know about kings or kingdoms, only about arcs, vertices, and faces on a sphere.", "files": [{"path": "crates/map-partition/src/lib.rs", "title": "The Partition's Vocabulary and Laws", "role": "Defines the core data types (vertices, edges, faces, rivers) and the mathematical invariants of a spherical map partition, plus the geometry helper functions used everywhere else.", "newbie": "Think of the globe as a jigsaw puzzle that must have zero gaps and zero overlaps. This file defines what a puzzle piece (a face) is, what an edge between two pieces is, and provides a checksum-like check - does everything add up to a whole sphere? - to make sure the puzzle is solved correctly. It's like a rulebook plus a very precise calculator for a 3D jigsaw.", "intermediate": "Defines VertexId/EdgeId/HalfId/FaceId as plain usize handles into shared vectors (an arena style common in Rust for graph-like data), plus structs PEdge, PHalf (half-edge), PFace, and Partition that together form a half-edge data structure - a standard way to represent spherical subdivisions where each edge is split into two directed halves that know their twin, next, and face. Includes compensated_sum (Neumaier-compensated summation) and tri_area/cycle_area for numerically careful spherical area math, since ordinary floating-point accumulation would otherwise break the areas-must-sum-to-4-pi invariant. Partition::validate() checks structural laws (twin/next consistency, no zero-length edges, exactly one Background face) and returns human-readable violation strings instead of panicking.", "advanced": "The half-edge invariant enforced by validate() (twin(twin) equals self, next(prev) equals self, matching faces, destination continuity) is the backbone every downstream algorithm relies on. dissolve_rings walks half-edges purely topologically (no float comparisons) to merge a set of faces into boundary rings by checking whether a half's face is in the set but its twin's is not - this is how partition_bridge turns hundreds or thousands of dissolved partition faces into one Area per entity. winding() computes a signed winding number via accumulated bearing change divided by two-pi, used both for face classification and for river-mouth and underwater-city tests. content_hash() is order-independent (it sorts vertices and edges by quantized coordinate keys) so identical geometry always hashes the same regardless of which order witnesses were supplied. RiverSystem::new cannot be constructed at all if its pieces are disconnected (union-find over vertex-to-segment touches), turning a whole bug class - a river arriving as separate collinear pieces - into an unrepresentable value rather than a runtime check.", "key_items": ["Partition - the whole half-edge arrangement: vertices, edges, halves, faces, rivers", "PFace::claims/conflicts - who claims a face and who lost the argument, kept for diagnostics", "Partition::validate - every structural law checked; an empty result means lawful", "Partition::dissolve_rings - merges a set of faces into boundary rings, pure topology", "RiverSystem::new - refuses to construct a disconnected river network", "compensated_sum / tri_area / cycle_area - numerically robust spherical area math backing the completeness law"]}, {"path": "crates/map-partition/src/build.rs", "title": "The Arrangement Builder", "role": "The actual algorithm that takes witness shapes (regions, borders, seeds, rivers) and constructs one lawful Partition: finding intersections, snapping nearby points together, assembling faces, and resolving overlapping claims.", "newbie": "This is the machine that actually builds the jigsaw puzzle described in lib.rs. You feed it rough tracings of countries, coastlines, and seed points (this point is inside Egypt), and it figures out where all the lines cross, glues together points that are basically the same place even though two source maps drew them slightly differently, and cuts the sphere into clean, non-overlapping pieces. When two sources disagree about who owns a spot, it has rules for picking a winner instead of just guessing.", "intermediate": "build_with() runs a pipeline: normalize witness rings and borders into line segments (Seg), find candidate node points (segment endpoints plus pairwise arc intersections via arc_intersection), cluster nearby candidates within tau_vertex using a union-find (Uf) so near-duplicate points collapse to one canonical vertex, split every segment into atomic arcs between consecutive nodes, then assemble half-edges by sorting outgoing edges at each vertex by bearing - the classic sort-by-angle step of planar arrangement construction. Faces come from tracing half-edge cycles and grouping them by containment signature (winding-number tests against representative points), so nested cycles become holes within one cell. An outer loop heals the arrangement by removing edges that do not actually separate two different faces (dangling stubs from partial witness merges) and reassembling until stable.", "advanced": "Precedence when multiple witnesses claim the same face is resolved by a sort key - rank by FaceKind, then parent-chain depth, then witness area, then id - which literally encodes water beats land, and among land the deepest and smallest witness wins, plus the subdivision rule that a claim with a parent only counts where the parent also claims, iterated to a fixpoint so grandchild chains resolve too. Sliver absorption (faces below sliver_area, or any non-wrap Background pocket) reassigns ownership by longest-shared-boundary neighbor rather than nearest centroid or a size threshold, avoiding tuned magic constants. WitnessSeed handling is definitional rather than geometric - the face containing the seed point IS the region - so seed-claimed faces can never fail to flush against water. The wrap face (the sphere's single unbounded outside) is identified as the one cycle group whose raw signed area comes out non-positive and needs plus-4-pi added, distinguishing it from every bounded face without any special-casing in the geometry itself. Two invariant-restoring loops run to a fixpoint before the function returns Ok: healing edges that end up with the same face on both sides, and removing edges that bound only unclaimed Background cells on both sides (floating artifact ink).", "key_items": ["build_with - the whole pipeline: witnesses in, one lawful Partition out", "arc_intersection / on_arc - great-circle segment intersection math on the unit sphere", "Uf (union-find) - deterministically clusters near-duplicate candidate vertices", "WitnessSeed - the face containing the seed point IS the region, flush by construction", "precedence sort (kinds.sort_by) - water beats land; the smaller, deeper witness wins on land", "the healing loop - removes edges that bound no real face split, then reassembles"]}]}, "map-compile": {"role": "map-compile is the offline build step that turns raw vendored data (polity boundaries, scripture narratives, terrain, basemaps) plus the partition's clean geometry into the canonical timeline - the single source of truth for who held what land, when - that the rest of the atlas renders from. It orchestrates fetching, parsing, reconciling conflicting sources, and validating the result before anything ships.", "files": [{"path": "crates/map-compile/src/lib.rs", "title": "The Compile Crate's Front Door", "role": "A tiny module file that declares and re-exports the five submodules (compile, reconcile, partition_bridge, timeline_bridge, vendor) that together make up the compiler.", "newbie": "This file is basically a table of contents. Rust needs every source file in a project to be listed somewhere so the compiler knows to include it; this file does that job for map-compile, naming its five chapters.", "intermediate": "Uses pub mod declarations to wire compile.rs, reconcile.rs, partition_bridge.rs, timeline_bridge.rs, and vendor.rs into the crate's public API, plus a cfg(test) tests module that only compiles when running tests. No logic lives here.", "advanced": "This is idiomatic Rust crate-root structure: lib.rs is the crate's module-tree declaration, not where behavior lives - main.rs is a separate binary target that depends on this library crate. Because every module is pub, main.rs and the test harness can reach deep functions like partition_bridge::gather_witnesses directly, which the codebase relies on so its law-checking tests build exactly what the real compiler builds.", "key_items": ["pub mod compile / reconcile / partition_bridge / timeline_bridge / vendor - the five chapters of the compiler", "cfg(test) mod tests - test-only module, compiled out of the shipped binary", "no logic here - purely a module-tree declaration"]}, {"path": "crates/map-compile/src/main.rs", "title": "The Compile CLI: refresh and build", "role": "The command-line entry point with two subcommands - refresh (pull fresh data from the atlas API and vendor it to disk) and build (assemble everything into the final canon.json).", "newbie": "This is the go button. Running map-compile refresh is like downloading fresh ingredients from a supplier and checking each box isn't damaged before it goes in the pantry. Running map-compile build is like a chef taking every ingredient in the pantry - vendored data, scripture surveys, terrain files, old hand-drawn maps - and cooking the final dish: one file, canon.json, that says exactly which kingdom held which land in which year, checked for mistakes before anyone is allowed to serve it.", "intermediate": "main() dispatches on the first argument to either the inline refresh logic or the build() function. Refresh fetches JSON payloads over a raw HTTP GET (http_get, from vendor.rs) for polities, narratives, per-leg events, eras, landmarks, and the land mask, parse-validating every payload before writing it, then calls write_vendor to write deterministic, content-hashed files. build() is much larger: it reads the vendored JSON back, calls into compile::compile_narratives (Journeys), partition_bridge::bridge_partition (Territory, Water, and ScriptureClaims via the sphere partition), timeline_bridge::bridge_filtered (Water, Relief, and Background from the older interval-timeline adapters), reconciles authored versus atlas routes via reconcile::reconcile_routes, and finally runs store.validate() plus a hand-written frame-edge check before writing canon.json and a markdown report.", "advanced": "The die function (typed to return the never type) is the crate's uniform failure path - no panics, no partial writes, always a message naming the exact offending row or file, and a nonzero exit code; it is used everywhere via the unwrap_or_else(|e| die(&e)) idiom. resolve_era is a closure passed by reference into partition_bridge::bridge_partition, decoupling how a partition-era id becomes an actual Timestamp from the partition-bridge module itself - which is why the surrounding comment insists WHO STANDS WHEN is entirely data-driven, never a hardcoded year or cohort. The frame-edge law (store.validate_frame_edge) enforces that no ScriptureClaims feature can dangle unexplained past the map's last year - a feature must either end or carry an explicit endurance mark - turning a forgotten era boundary into a build failure instead of a silent rendering bug. Territorial-overlap violations are partitioned into waived (present in reconcile.json's acknowledged conflicts) and fatal violations, so an unwaived overlap between polities still fails the whole build even though the geometry itself is otherwise valid - reconciliation is a real gate, not just documentation.", "key_items": ["main() dispatch - refresh versus build subcommands", "die(&str) -> ! - the crate's single point of loud, informative failure", "resolve_era closure - turns vendored era ids into Timestamps without hardcoding history", "bridge_partition / compile_narratives / bridge_filtered - the three feeds into the canon store", "frame-edge law - no ScriptureClaims feature may dangle past the frame's last year without an endurance mark", "waived versus fatal violations - reconciliation gates which territorial overlaps are acceptable"]}, {"path": "crates/map-compile/src/partition_bridge.rs", "title": "Sphere Partition Into the Canon", "role": "The biggest bridge file: gathers every geographic witness (plate tracing, seas, lakes, rivers, tribal allotments, neighbor nations, atlas polities), runs the sphere partition, and turns its faces into canon Areas across every historical era.", "newbie": "Imagine a dozen different old maps of the ancient Near East - a hand-traced plate of Canaan, a modern satellite outline of the Mediterranean, a Wikipedia map of the twelve tribes, and official records of which empire ruled what and when. This file is the one place that gathers all of them, hands them to the puzzle solver in map-partition, and then, era by era, decides which single owner gets painted onto each puzzle piece, so the map never shows two kingdoms claiming the same land at once - and it correctly draws a city as a submerged memory rather than a dot if its traditional site is now underwater.", "intermediate": "gather_witnesses() builds the full list of WitnessRegion and WitnessPolyline inputs: the Canaan plate ring, the real Mediterranean and lakes from Natural Earth, a raster-buffered Jordan corridor, OSM rivers filtered through RiverSystem::classify so only water that actually reaches the map's seas, lakes, or corridor survives, tribal allotments and OpenBible neighbor regions snapped onto shared borders via snap_ring_to so no knife-edge slivers form, and one witness per atlas-polity era. bridge_partition() then builds the Partition, and for each era computed by a PresenceBook (a who-exists-when ledger) calls bundle_faces() to group that era's faces by owning entity and Partition::dissolve_rings to merge each entity's many partition faces into clean outer and hole rings, inserting one Feature::Area per entity per era. Cities are placed as Feature::Point landmarks, except ones whose traditional site now sits under water (checked with winding against the water rings), which become Feature::Memory instead.", "advanced": "PresenceBook, plus a second book entity_disjoint, jointly implement the module's core invariant of one entity per place per era: presence decides which claimant's ground is drawn at any moment (era.absent names claimants not yet on stage, and bundle_faces picks each face's first claimant not in that absent set, from the partition's own precedence-ordered face.claims list), while entity_disjoint.declare fails loudly if two era-variants of the same atlas polity id would stand at the same instant. bundle_faces gathers a set of raw partition face indices per entity and calls dissolve_rings exactly once per entity per era - the payoff of map-partition's pure-topology dissolve, since the whole-frame arrangement dices every territory against every other era's borders, so thousands of diced faces collapse into one true outer boundary with holes, and the renderer draws one filled shape instead of a lattice of same-colored slivers. overlay_features is the mechanism by which a bundle of features enters time: it re-derives the full moment set of a layer's World, inserting from and until as new turning moments that inherit whatever was already in effect, then adds the new feature ids only within that half-open span - this is how a newly discovered era-cohort integrates into an already-built layer without disturbing unrelated moments. Rivers are noded directly into the partition's own vertex pool (a border river gets river:true on the shared canonical edge rather than a separate parallel line), and settlement placement runs a real geometric test (winding against every sea and lake ring) rather than a curated drowned-cities list, so which cities are now underwater is measured, not authored.", "key_items": ["gather_witnesses - assembles every geographic source into WitnessRegion/WitnessPolyline for map-partition", "PresenceBook / entity_disjoint - WHO STANDS WHEN, and the law that one entity cannot wear two witnesses at once", "bundle_faces - groups an era's partition faces by owning entity, ready to dissolve", "overlay_features - merges a new feature set into a layer's timeline without disturbing existing moments", "snap_ring_to - snaps tribal and neighbor rings onto shared water and parent arcs so no knife-edge slivers form", "drowned settlements become Feature::Memory - a city under the Dead Sea becomes an inscription, not a dot, decided by real winding-number geometry"]}, {"path": "crates/map-compile/src/timeline_bridge.rs", "title": "Old Timeline Model Into the Canon", "role": "Converts the earlier interval-based WorldTimeline representation (used for water, terrain/relief, and historical basemaps) into the canon's Area/Snapshot/World model, so legacy and new pipelines can coexist during migration.", "newbie": "Before this project's newest canon data format existed, an older format tracked map regions as simple date ranges - this shape existed from year X to year Y. This file is a translator between the old format and the new one, so the old format's water, terrain, and basemap data can still feed the same final map without anyone rewriting it from scratch. The comment at the top of the file even says the plan is to delete this translator once nothing needs it anymore.", "intermediate": "bridge_filtered() is the general-purpose converter: it walks every region in a WorldTimeline, optionally filtered by RegionClass, converts each interval-and-geometry pair into a canon Feature::Area (resolving boundary cycles into Borders via resolve_cycle), and then does an edge sweep - collecting every interval's start and exclusive end into a sorted set of Timestamps - to build a World of snapshots, one per moment, holding exactly the areas whose interval covers that moment. shadow_spans lets a region be temporarily hidden during years another witness (an atlas Territory polity) claims the same slug, without ever treating the shadow as a hole in time.", "advanced": "resolve_cycle special-cases an empty cycle as the whole sphere - the historical world-ocean background - synthesizing a near-antipodal three-point sentinel ring that downstream projections render as everything, reusing a sentinel pattern from the older provider rather than adding a distinct background flag. The Tenure field on Area is set here based on RegionClass::Claim versus everything else: Claim-class geometry (visions, city-derived hulls, promise lines) is marked Tenure::Claimed so it can never accidentally render or validate as governed held ground, encoding the tenure law directly at ingestion. Merging with an already-populated layer - bridge_filtered can be called multiple times into the same LayerKind, for instance Water receiving both ocean/lake and terrain features - re-derives the full moment set as the union of old and new edges and recomputes each moment's active set from the nearest earlier existing row, which is how repeated calls stay consistent rather than clobbering each other.", "key_items": ["bridge_filtered - converts a WorldTimeline into canon Areas and Snapshots, with an optional class filter and shadow spans", "resolve_cycle - turns boundary-id cycles into a single ring Border, treating an empty cycle as the whole sphere", "edge sweep - every interval start and exclusive end becomes a canon Timestamp moment", "shadow_spans - a region is hidden, never deleted, during years another witness owns the same entity", "Tenure::Claimed versus Held - RegionClass::Claim geometry is marked so it can never render as governed territory"]}, {"path": "crates/map-compile/src/reconcile.rs", "title": "No Silent Precedence: Reconciliation Rules", "role": "Parses and enforces data/authored/reconcile.json, the file that explicitly settles every conflict between hand-authored (scripture-derived) data and atlas-sourced data, so nothing is dropped or overridden without a recorded reason.", "newbie": "Sometimes two different sources disagree - an old hand-written map might describe a journey that a newer, more detailed atlas source also describes, slightly differently. Instead of the code silently picking a winner, this file requires a human to have written down, in a plain JSON file, exactly which source wins and why. If a journey exists in the hand-authored data but nobody wrote down what to do with it, the whole build stops and complains, like a strict editor who will not let a fact go to print without a citation.", "intermediate": "parse_reconcile reads three kinds of judgment calls from JSON into a Reconcile struct: routes (RouteRule::Keep or RouteRule::SupersededBy naming an atlas narrative id), region_drops (authored region groups replaced by an atlas polity), and territory_waivers (acknowledged, still-open territorial overlaps between two entities). reconcile_routes then cross-checks every authored route tag against these rules, returning an error naming the tag if a rule is missing, and erroring if a SupersededBy names an atlas narrative id that does not actually exist.", "advanced": "Every function here returns a Result with the offending identifier baked into the message, matching the crate-wide fail-loud, name-the-row convention; there is no default leniency - an authored route with zero reconcile.json entries is a hard build failure, which is the file's real thesis: silence is not an acceptable resolution to a data conflict. is_waived is order-independent, checking both (a,b) and (b,a), because a territorial conflict between two entities is symmetric - this keeps main.rs's partition of violations into waived versus fatal correct regardless of which entity the canon happened to report first.", "key_items": ["Reconcile - parsed routes, region_drops, and territory_waivers judgment calls", "reconcile_routes - every authored route must have a rule, or the build fails naming it", "RouteRule::SupersededBy - must name a real atlas narrative id, checked at compile time", "is_waived - symmetric lookup of acknowledged territorial conflicts"]}, {"path": "crates/map-compile/src/compile.rs", "title": "Narratives Into Journeys", "role": "Converts atlas narrative rows (a sequence of dated biblical events and legs) plus the gazetteer into the canon's Journeys layer - the animated travel routes, like the Exodus, shown on the map.", "newbie": "This turns a story like then they went from Egypt, to the Red Sea, to Sinai into map data: a line with real coordinates and real dates for each leg of the journey, so the viewer can watch the route appear on the map exactly when the story says it happened. If a place name in the story cannot be found on the map, or an event has no date, the build stops and says exactly which narrative and event is the problem, rather than drawing a wrong or missing line.", "intermediate": "compile_narratives looks up each narrative's leg ids in the vendored events table, resolves each event's place through the gazetteer, and fills in missing dates by carrying known dates forward and backward through the stops, since not every event in a walking narrative carries its own explicit date. It builds one Leg per pair of consecutive stations, with a Border (a straight two-point arc) and a span of Timestamps, bundles all legs of one narrative into a Feature::Way(Route), and then reuses the edge-sweep pattern seen elsewhere to produce the Journeys World. append_ways does the same for extra routes (kept-but-superseded authored routes) added after the main narratives, merging into the layer's existing moments rather than replacing them.", "advanced": "The gap-filling pass over whens is a two-direction forward-then-backward fill that guarantees every station gets some date as long as at least one event in the whole narrative carries one, and only errors if the narrative has literally zero dated events - deliberately permissive about missing individual dates but strict about the narrative having any temporal anchor at all. The swap that reorders a leg's depart and arrive timestamps defensively normalizes an inverted date pair (an arrival event dated before the departure event, which can happen with overlapping or uncertain event ranges) into a valid non-negative span rather than producing an invalid interval downstream. append_ways reconstructs the union of moments by reading each snapshot at the nearest earlier existing row - the same inherit-whatever-was-already-active trick used in partition_bridge::overlay_features and timeline_bridge::bridge_filtered, showing this is a repeated idiom across the bridge layer for merging into an already-built World without invalidating its earlier moments.", "key_items": ["compile_narratives - turns dated narrative legs into Feature::Way(Route) and a Journeys World", "whens gap-fill - forward and backward date propagation so only fully-undated narratives fail", "Leg span normalization - swaps an inverted depart/arrive pair into a valid interval", "append_ways - merges extra routes into an already-built Journeys layer without disturbing existing moments", "edge sweep - the shared pattern of turning interval starts and ends into canon Timestamps"]}, {"path": "crates/map-compile/src/vendor.rs", "title": "Parsing the Raw Data In", "role": "Defines the typed row structs (PolityRow, NarrativeRow, EventRow, EraRow, LandmarkRow, LandMask) and the strict parsers that turn raw JSON from the atlas API into them, plus the minimal HTTP client and deterministic vendor-file writer used by refresh.", "newbie": "Before any of the map-building logic can run, someone has to actually read the raw JSON files and check they have the fields we expect - a polity needs an id, a name, start and end years, and a shape. This file is that strict bouncer at the door: if a data file is missing a field or has the wrong type, it is rejected immediately with a clear complaint, instead of letting bad data sneak further into the pipeline and cause a confusing crash somewhere else.", "intermediate": "Small helper functions field, str_field, i32_field, and rings_field each look up one field from a JSON value and return an error naming both the field and the surrounding row context if it is missing or the wrong type; every parse_* function (parse_polities, parse_narratives, parse_event, parse_eras, parse_landmarks, parse_land_mask, parse_vendored_events) is built from these same small pieces, so validation logic is not duplicated per row type. write_vendor sorts payloads by filename, hashes them together in that fixed order, and writes both the files and a manifest.json recording that hash as a pin - a deterministic content fingerprint. http_get is a from-scratch minimal HTTP/1.1 client (a raw TcpStream, manual header parsing, manual chunked-transfer dechunking) rather than a full HTTP library, since it only ever talks to the local atlas API on loopback.", "advanced": "The context string threaded through every field accessor, often built before the row is even known to be well-formed, is what makes vendor.rs's errors actionable rather than generic - a bare bad json error tells you nothing, while naming the specific row and field tells you exactly what to fix - the same name-the-offending-row discipline enforced end-to-end by main.rs's die. write_vendor's determinism (sorted names, no timestamps, no randomness in the hash) is what lets refresh honestly claim the pin moves only if the data moved: re-running refresh against unchanged upstream data reproduces byte-identical vendor files and the identical pin, a meaningful integrity and caching signal precisely because nothing here introduces nondeterminism. dechunk implements HTTP/1.1 chunked transfer decoding by hand - reading a hex size line, then that many body bytes, repeating until a zero-size chunk - exactly the kind of protocol detail a dependency would normally hide, but small and stable enough here that the crate chose to own it rather than add a dependency for one local, trusted endpoint.", "key_items": ["field/str_field/i32_field/rings_field - small typed JSON accessors that name the offending field on failure", "PolityRow / NarrativeRow / EventRow / EraRow - the typed shapes every parse_* function targets", "write_vendor - deterministic content-hash pin: identical payloads always produce the identical pin, byte for byte", "http_get / dechunk - a from-scratch minimal HTTP/1.1 client for the local atlas API, including manual chunked decoding"]}]}, "map-canon": {"role": "The canonical store: the single source of truth for every border, feature, and moment-in-time snapshot in the atlas. It hashes content into stable ids so identical geometry is never stored twice, groups features into layers (Territory, Water, Journeys, etc.) that each carry their own timeline of who-held-what-when, and enforces hard laws (no self-overlapping territory, no dangling references) before anything downstream is allowed to trust it. map-compile writes into it; map-provider reads out of it.", "files": [{"path": "crates/map-canon/src/lib.rs", "title": "The Canon Store", "role": "Defines the atlas's canonical data model (borders, features, snapshots, worlds, layers, provenance) and the laws that keep it honest — the one place every other crate ultimately trusts.", "newbie": "Think of this file as the atlas's master filing cabinet. Every border (a shape's outline) and every feature (a country, a river, a city) gets filed under a label that IS a fingerprint of its own content — so if two different sources describe the exact same shape, it only gets filed once. A 'World' is just a stack of snapshots, one per moment in time, like a flipbook where each page shows who owned what. The file also contains the rulebook: for example, two countries are never allowed to physically overlap at the same moment, and if the data breaks that rule, this code catches it and names exactly which countries and when.", "intermediate": "The core types are newtype wrappers around a `ContentHash` (BorderId, FeatureId, SnapshotId, generated by a `content_id!` macro), a `Feature` enum (Area, Way, Point, Line, Memory) covering everything the atlas can draw, and `CanonStore`, which holds everything in `BTreeMap`s keyed by those content ids. `World` is a `BTreeMap<Timestamp, SnapshotId>` — inserting a second, different snapshot at an already-occupied instant is a hard error (`WorldError::ContradictionAt`), not a silent overwrite. `PresenceBook` is a separate small state machine tracking which named claimants are absent over which time spans, and its `eras()` method derives the minimal set of time-windows where presence is constant, rather than anyone hand-listing them. `CanonStore::validate()` walks every layer and returns every law violation it finds (unresolved references, backward-running route legs, territorial overlaps) as a `Vec`, never stopping at the first one.", "advanced": "Content addressing is explicit: `feature_bytes`/`border_bytes`/`snapshot_bytes` produce a deterministic byte encoding (via the `map_types::ident::Canon` byte-builder) that `hash_bytes` reduces to a `ContentHash`, so `insert_feature`/`insert_border`/`insert_snapshot` dedup by construction — two calls with identical content always produce the same id and only the first insert sticks (`.entry(id).or_insert(f)`). Territorial overlap detection (`areas_overlap`/`rings_overlap`) is a real geometric algorithm: `point_strictly_in_ring` tests strict interior membership via a spherical azimuth-sweep winding number (deliberately excluding the boundary, so shared edges are peace, not war), and `rings_overlap` only flags overlap when penetration depth exceeds `TERRITORY_TOLERANCE_DEG` (0.2 degrees), a constant derived from measured tracing slop on real atlas polities, not tuned by feel. `PresenceBook::eras()` is a fold, not an enumeration: it collects every standing-span boundary into a sorted cut-point set and derives each era's absent-claimant set from `present()`, so a caller never writes 'the tribes are absent in era 2' as code — it falls out of the data. `census()`/`census_diff()` produce a flattened, sorted table of every feature standing at an instant and a structural diff between two instants, keyed by (layer, entity) so a renamed or retyped feature shows as `Changed`, not a spurious Removed+Added pair — this is the reviewable artifact the compile pipeline's stages are judged against.", "key_items": ["CanonStore — the hash-addressed store of borders, features, snapshots, layers, and provenance; validate() enforces every law", "Feature (enum: Area, Way, Point, Line, Memory) — every drawable thing the atlas knows about", "World — a BTreeMap<Timestamp, SnapshotId>; state_at() answers 'what did this layer look like at time T'", "PresenceBook — tracks who is absent over which time spans and derives the eras where presence is constant", "census()/census_diff() — the flattened, diffable table view of the whole canon at an instant", "areas_overlap()/rings_overlap() — spherical winding-number overlap test with a measured tolerance, not a tuned one"]}, {"path": "crates/map-canon/src/registry.rs", "title": "The Entity Registry", "role": "Resolves the fact that many different data sources mint their own id for the 'same' real-world place, merging them into one entity only when a person has explicitly written down why — never by matching names.", "newbie": "Imagine several people each keeping their own contact list, and some of them have entries for the same person under different spellings or nicknames. This file is the process of merging those contacts — but it refuses to merge two entries just because the names look similar. It only merges when someone explicitly says, in writing, 'these two really are the same thing, and here's why.' That written reason is kept forever, so nobody has to guess later why Judea the historical province and Judea the Bible-authored region were treated as one place.", "intermediate": "`Registry` stores a one-hop alias map (`minted -> canonical`), a parallel map of the written `Unification` reason for each alias, the full set of every id ever minted, and the materialized `Entity` records (names, kind, witnesses) living at each canonical home. `declare(canonical, minted, why)` records an alias and merges any existing `Entity` at `minted` into wherever `canonical` itself currently resolves — never into a stale, already-vacated key. `observe(minted, name, kind, witness)` is how a witness reports a sighting; it automatically records a trivial `SameId` unification only when it sees the exact same minted id a second time. `resolve()` is total (an unknown id resolves to itself) and strictly one-hop by design.", "advanced": "The one-hop invariant is enforced structurally, not just documented: `declare` never chases `canonical` through its own existing aliases before recording the new alias (so `aliases` can legitimately contain a chain), but it DOES resolve through the alias table when picking the *merge target* for an entity's data — this asymmetry is deliberate, since it lets `validate()`'s `ChainedUnification` check catch the exact same chain the merge step quietly worked around. `validate()` returns three kinds of `RegistryViolation` — `DanglingCanonical` (a declared canonical nothing ever minted, i.e. a typo), `ChainedUnification` (A resolves to B which itself resolves to C), and `KindConflict` (two witnesses disagreeing about whether an entity is, say, a Polity or a Promise) — and it always returns every violation found in one pass, never just the first, by design (see the module doc's law about not making the owner run a validator twenty times to see twenty typos).", "key_items": ["Registry.declare() — records why two minted ids are one entity, with a written, typed reason (never inferred)", "Registry.observe() — records one witness's sighting of a minted id under a name and kind", "Registry.resolve() — total, strictly one-hop id resolution", "Unification (SameId | Declared) — the reason two ids are one entity, always written down", "validate() — returns every RegistryViolation (DanglingCanonical, ChainedUnification, KindConflict) in one pass"]}, {"path": "crates/map-canon/src/persist.rs", "title": "Canon Persistence", "role": "Saves the CanonStore to deterministic JSON and loads it back, recomputing every content id from scratch so a corrupted or hand-edited file is refused loudly rather than trusted silently.", "newbie": "This is the save-file logic. Saving is straightforward: write everything out as JSON in a stable order. Loading is the interesting part — instead of just trusting the ids written in the file, it recalculates every single id from the actual data (the same fingerprinting from lib.rs) and checks that it matches what the file claims. If someone hand-edited the file and broke something, or if it got corrupted, loading fails immediately with a clear error instead of silently loading broken data.", "intermediate": "`to_bytes` walks the `CanonStore`'s `BTreeMap`s (borders, features, snapshots, layers, provenance) and builds a `serde_json::Value` tree, relying on `BTreeMap`'s sorted iteration for byte-stable output. `from_bytes` does the reverse, but crucially it doesn't just deserialize structs — it calls the store's own `insert_border`/`insert_feature`/`insert_snapshot` methods (the same ones used when building a canon from scratch), which recompute each id from the parsed content, then compares that recomputed id against the id declared as the JSON key and errors out on any mismatch (`'{declared}: content does not match its id'`).", "advanced": "This module intentionally has no independent notion of 'trust the file' — every id is a derived value, never a stored one that's merely echoed back. `layer_from` is the hand-written inverse of `lib.rs`'s `layer_name`, and a dedicated round-trip test (`layer_name_and_layer_from_round_trip_every_kind`) pins every `LayerKind` variant through both directions, specifically because a prior refactor found this module had its own second copy of the same wire-string mapping with nothing tying the two together — a classic 'two definitions of one truth' bug class this test exists to prevent from recurring.", "key_items": ["to_bytes() — serializes the CanonStore to deterministic pretty JSON", "from_bytes() — deserializes and RECOMPUTES every content id via CanonStore's own insert methods, refusing any mismatch", "hex()/unhex() — ContentHash <-> hex string wire encoding", "layer_from()/layer_name() — the single source of truth for layer wire-name strings, round-trip tested"]}]}, "map-provider": {"role": "The query layer: turns a request like 'draw the scene at 1405 BC with these pieces and this viewport' into a concrete Snapshot (regions, boundaries, labels, markers) by walking the compiled CanonStore. It owns all the rendering judgment calls that must stay consistent across every render — palette coloring so neighbors never match, label placement, level-of-detail simplification, paint order — computed once at load where possible and applied per-query otherwise.", "files": [{"path": "crates/map-provider/src/lib.rs", "title": "Map Provider Crate Root", "role": "The small entry point of the provider crate: wires up canon_provider as the crate's one implementation of the MapProvider contract, and declares one shared constant.", "newbie": "This file is mostly bookkeeping — it tells Rust 'the real logic lives in the canon_provider module' and defines one shared label, `scripture`, used later to mark which map content comes from Biblical sources (so a viewer can filter to 'Bible mode').", "intermediate": "Just a `pub mod canon_provider;` declaration plus the `SCRIPTURE_SOURCE` constant, which is duplicated (deliberately, per its doc comment) as a private copy inside `canon_provider.rs` itself for local use. Also documents that an older phase-3 'interval-timeline' reference provider used to live in this crate until `CanonProvider` absorbed its last remaining capability (morph transitions).", "advanced": "The doc comment records real project history: this crate used to host two implementations of the `MapProvider` trait (a canon-backed one and an older interval-timeline reference one used during migration), and this file is the marker that the migration is complete — there is now exactly one production `MapProvider` implementation in the pipeline, `canon_provider::CanonProvider`.", "key_items": ["SCRIPTURE_SOURCE — the attribution/filter tag for Bible-sourced content", "pub mod canon_provider — the crate's sole MapProvider implementation lives here"]}, {"path": "crates/map-provider/src/canon_provider.rs", "title": "The Canon Provider (Scene Renderer)", "role": "The heart of map-provider: implements the MapProvider trait by reading a compiled CanonStore and answering 'render the scene at time T, with these pieces, at this level of detail' as a Snapshot the encoders can consume.", "newbie": "Picture a chef who has a fully-stocked pantry (the canon, holding every border and country ever recorded across all of history) and today's order slip (a year, a zoom level, and a list of what to include — borders, rivers, labels...). This file is the chef: it walks the pantry, picks out ex
