actly what's needed for that one order, decides what color each country should be painted (making sure neighboring countries never get the same color), figures out where each country's name label should sit, and simplifies faraway detail so the plate doesn't get overcrowded. The result is a 'Snapshot' — a fully assembled but still abstract scene, not yet a picture.", "intermediate": "`CanonProvider` wraps the `CanonStore` alongside several caches computed once at construction time for speed: `palette_slot` (a color slot per entity), `relief_pos` (elevation-band ordering), `label_anchor` (best label point per area), and `border_cap` (a bounding-cap per border used for cheap viewport culling). The central method `scene_at()` picks which `LayerKind`s are relevant to the requested `Piece`s via `layers_wanted()`, then for each active feature calls `push_area`, `push_way`, or handles Lines/Points/Memories inline, filling a `Snapshot`'s regions, boundaries, labels, and markers. `pieces_of_layer()`/`piece_of_region()`/`piece_of_boundary()` form a small 'total function' pattern — every `LayerKind` must explicitly declare which `Piece`s it can contribute, so adding a new layer without updating these fails to compile rather than silently rendering nothing.", "advanced": "Several genuinely nontrivial algorithms live here, each named in its own doc comment. Palette assignment is graph coloring: `entity_vertex_keys`/`adjacency_from_keys` build an adjacency graph where two area entities are 'neighbors' if they share two or more identical (rounded) border vertices, and `color_shared_border_graph` runs a Welsh-Powell-style greedy pass (highest-degree first) over 8 global slots, computed once at load in `palette_slots`. `repaired_slots_at()` then does a *live, per-render* repair on top of that stable base: an entity keeps its home slot unless a currently-visible neighbor actually wears it, in which case it picks the least-worn free slot — the 'stable home color, repaired only where a real neighbor conflicts' hybrid fix referenced in the git history. Level-of-detail is handled by `lod_at()`, which gives full query resolution inside the viewport's cap and otherwise derives a coarser floor from the angular distance to the cap (not a tuned constant); `ring_points()` returns a typed `RingFidelity::Survives`/`BelowLimit` verdict so a feature can be geometrically thinned but never erased (`push_area` falls back to its widest below-limit ring when every outer ring collapses, preserving identity at every zoom). Paint order across layers is an explicit rank table baked into `scene_at()`'s sort key (Relief=0, Background=1, ScriptureClaims=2, Territory=3, Water=4, Journeys=5) plus largest-area-first within a rank. `transition()` builds an animation script by diffing `ChangeEvent`s (produced once by `derive_events()` from moment-to-moment feature-id changes per layer) into `Morph` (equal-count resampled slerp geometry via `resample()`), `FadeIn`/`FadeOut`, `SplitAlong`, and `MergeAcross` steps, with `invert()` reversing a whole script for backward-in-time playback. `pole_of_inaccessibility()` computes label anchors via a grid-search-plus-refinement algorithm operating in a local lon/lat tangent frame, explicitly noted as having been 96% of a world render's cost before being hoisted to a one-time precompute.", "key_items": ["CanonProvider.scene_at() — the core query: canon + time + pieces -> Snapshot", "palette_slots()/color_shared_border_graph() — graph coloring so touching territories never share a fill color", "repaired_slots_at() — the live per-render palette repair pass (stable home color, fixed only on real conflict)", "lod_at()/ring_points()/RingFidelity — viewport-aware level-of-detail that thins geometry but never erases identity", "transition()/derive_events() — builds Morph/FadeIn/FadeOut/Split/Merge animation scripts from canon moment diffs", "pole_of_inaccessibility() — the one-time label-anchor computation per area feature"]}]}, "map-encoders": {"role": "The last stop in the pipeline: turns a provider's abstract Snapshot into actual output bytes. One backend writes SVG (for a browser or a static image, in either a globe or flat-map projection), one writes GeoJSON for other GIS tools, and one writes a compact binary wire format plus a JSON manifest that the WebGL viewer consumes directly on the GPU. No format-specific knowledge exists anywhere upstream of this crate.", "files": [{"path": "crates/map-encoders/src/lib.rs", "title": "SVG & GeoJSON Encoders", "role": "Turns a provider's Snapshot into concrete output bytes: SVG markup (globe or flat-map projection) for viewing, or a GeoJSON FeatureCollection for other GIS tooling.", "newbie": "If map-provider decides WHAT to draw (this country here, that label there), this file decides HOW to actually draw it as a real image file. It has to solve a genuinely tricky problem: the world is a sphere, but a screen or image is flat, so it needs a projection — either an orthographic 'globe' view (like looking at an actual globe from space) or a flat rectangular map. It also has to clip away the far side of the globe, smooth out jagged country outlines into gentle curves, and squeeze labels in without them overlapping.", "intermediate": "`SvgEncoder` is a small config struct (width, padding, `Projection::Globe`/`Projection::Flat`, smoothing, paper/chrome/pattern styling). The key abstraction is `Chart`, a struct of closures (`clip_ring`, `clip_line`, `place`) that both projections fill in identically, so a single `encode_chart()` function does the real work (calling `emit_scene()` then `emit_labels()`) without caring which projection is active. `Globe` holds the orthographic projection math (an east/north basis around a center point). `GeoJsonEncoder` is much simpler: it just maps `Snapshot` regions/boundaries/markers/labels directly into GeoJSON Feature objects.", "advanced": "`clip_ring_front()` clips a closed ring to the visible front hemisphere using an azimuth-sorted crossing algorithm: it finds every point where the ring's edges cross the horizon ('limb'), sorts those crossings by azimuth around the view axis, decides inside/outside membership for one limb arc via `inside_ring` and alternates from there (since crossings must alternate), then stitches visible ring-chains together with limb arcs as a two-regular graph walk — explicitly documented as replacing an older, buggy approach that accumulated azimuth over hidden vertices (unstable near the antipode). Curves are drawn with a Catmull-Rom interpolating spline (`path_smooth`) that passes through every real vertex exactly, only softening corners. Label placement (`emit_labels`) enforces a legibility floor (`page_width / 260`, minimum 4px), shrinks region labels to fit their territory's on-page extent, and tries a small set of vertical nudge offsets before dropping a label rather than letting it collide with an earlier-placed one — placement priority is just scene order, so it's fully deterministic. Off-page geometry is aggressively thinned (`thin_offpage`) while a fill's winding-relevant crossing points are preserved, and `chunk_matters` vs `chunk_touches` distinguish 'this fill's winding still affects the visible page' from 'this stroke would actually paint a visible pixel' — a subtle but load-bearing distinction. The flat projection uses classical Sutherland-Hodgman polygon clipping (`clip_ring_to_window`) against the crop window, and both projections share one 'camera law': the page width always spans 2×zoom great-circle degrees at the view center, so switching between globe and flat at the same zoom shows the same ground.", "key_items": ["SvgEncoder/Projection (Globe | Flat) — the two supported ways to flatten the sphere onto a page", "Chart — the shared closure-based abstraction that lets one encode_chart() serve both projections", "clip_ring_front() — azimuth-sorted limb-crossing clip of a ring to the visible hemisphere", "path_smooth() — Catmull-Rom interpolating spline for curved, vertex-exact country outlines", "emit_labels() — deterministic, collision-avoiding, shrink-to-fit label placement", "GeoJsonEncoder — the plain FeatureCollection backend for external GIS tools"]}, {"path": "crates/map-encoders/src/gpu.rs", "title": "The GPU Wire Format (§63)", "role": "Encodes a Snapshot into a semantic JSON manifest plus content-addressed binary geometry packets that a WebGL/retained-mode renderer loads directly onto the GPU, with no pixels or projected coordinates baked in.", "newbie": "Instead of shipping a finished picture (like the SVG encoder does), this file ships something more like a box of labeled building blocks plus an instruction sheet: each shape's raw 3D points go into their own small binary file (a 'resource'), and a JSON manifest lists which resources go where, in what color, in what order. The browser's graphics card assembles the actual picture itself. This is much faster when the user just rotates the globe or changes the time slider, because most of those building blocks don't need to be resent — only the instruction sheet changes.", "intermediate": "`GeometryId`/`ResourceId` are content hashes, `ResourceKind` distinguishes `LineStrip`/`RingLoop`/`Points`, and `pack()` builds a `GeometryResource` (a `ResourceDescriptor` plus its packed binary `payload`). `GpuSceneEncoder::build()` walks a `Snapshot`'s regions, boundaries, and markers, deduplicating identical geometry into one resource via a `seen: BTreeMap<ResourceId, usize>` map, and produces `FeatureInstance` entries that tie each semantic feature to its geometry, resource, and resolved `GpuStyle` (Fill/Stroke/Marker). Labels, markers, and inscriptions ride the manifest as plain semantic data (text, spherical anchor, subject id) — placement and rasterization are left entirely to the GPU-side consumer.", "advanced": "The binary packet layout is documented and fixed byte-for-byte in `pack()`'s doc comment: 4-byte magic `MGR1`, u32 kind, u64 resource id, u64 geometry id, three f32 bounds-center components plus an f32 angular radius, u32 vertex count, u32 index count (always 0 in format 1), then the vertex payload as count × (f32 x, f32 y, f32 z), all little-endian. Content dedup is structural, not incidental: `geometry_id()` hashes only the point sequence (§6, no time/style/view baked in) while the resource id hashes kind+vertices together (§7), so identical geometry used by many features or across many years/styles resolves to exactly one resident GPU buffer. Antimeridian handling is a real geometric fix: `crosses_antimeridian`/`split_line_at_antimeridian`/`split_ring_at_antimeridian` detect and split geometry that crosses the ±180° seam using a plane-through-the-poles clip (`y = 0`), with the two resulting ring pieces sharing cut edges that cancel exactly under even-odd fill parity — so no chart ever draws a seam-crossing streak, and geometry that never touches the seam ships completely untouched (same ids as before). `densify_run()` subdivides long edges to a `MAX_EDGE_STEP` of 0.05 radians, a constant explicitly *derived* from a half-pixel chord-error bound at the project's reference 1200px page rather than tuned by eye. The marker grouping key is `(style, piece)`, not `(piece, style)` — documented as a real historical bug fix, since keying by piece-major would re-sort markers across unrelated paints and change pixels, whereas style-major only affects ordering within buckets that had no prior guaranteed order.", "key_items": ["pack() — builds the exact §63 binary packet: magic, kind, ids, bounds, vertex count, then f32 xyz vertices", "GpuSceneEncoder.build() — dedups region/boundary/marker geometry into content-addressed resources", "geometry_id()/ResourceId — separate content addresses for raw points (§6) vs. kind+payload resources (§7)", "split_ring_at_antimeridian()/split_line_at_antimeridian() — plane-clip geometry at the ±180° seam, parity-safe", "densify_run() — great-circle edge subdivision bounded by a derived half-pixel error limit", "EncodedScene.manifest_json() — hand-written deterministic JSON serialization of the whole manifest"]}]}, "map-viewer": {"role": "The server/UI edge: a composition root (`load()`) wires the compiled canon and style templates into one `App`, and a hand-rolled HTTP server (no framework, just `std::net::TcpListener`) answers the workbench's routes (/api/scene, /api/subjects, /api/census, /api/changes, /api/render, and more) by composing scenes and encoding them. The same route logic is reused by the `map-cli` binary to write the identical bytes to files instead of sockets, and the browser front-end itself ships as one embedded `page.html`.", "files": [{"path": "crates/map-viewer/src/lib.rs", "title": "The workbench server (built from scratch, no framework)", "role": "The composition root and hand-rolled HTTP server: loads the compiled canon and style templates into one App, then answers every /api/* route and serves the embedded browser page — all on raw std::net::TcpListener sockets, with no web framework underneath.", "newbie": "Most web servers are built on top of a 'web framework' — a pre-made toolkit that handles reading HTTP requests, matching URLs to code, and so on (like Express for JavaScript or Flask for Python). This file doesn't use one at all: it opens a raw network socket, reads the bytes a web browser sends, manually figures out which URL was requested, and writes the HTTP response bytes back by hand. It's like building a restaurant without buying a 'restaurant-in-a-box' kit — this one file is the front door, the kitchen, and the menu printer all at once, and it even hands the browser its own front-end code (a page.html file baked directly into the compiled program).", "intermediate": "`App` is the one shared state struct: it holds a `provider` (the compiled map data, accessed only through the `MapProvider` trait — never directly), the set of loaded `styles` and their `ghosts`/`overlay_tints` (faded and tinted variants derived automatically from each base style), a list of scrub-bar `stops` (years where something changed), and a `ResourceStore` (a capacity-bounded cache of encoded geometry payloads, evicted oldest-generation-first when it exceeds its budget). `load()`/`load_canon()` is the composition root: the only place in the crate allowed to wire the map-adapters/map-provider machinery together. `route()`/`route_text()` is one big `match` over URL paths (`/api/scene`, `/api/census`, `/api/render`, ...) that parses query-string parameters with the small `Params` helper (including a hand-written `url_decode` for `%XX`/`+` sequences) and calls into the provider. `handle()` is the raw socket loop: it reads bytes until it sees the end of HTTP headers, parses just the request line and one header (`If-None-Match`, for cache revalidation), and writes back a manually-formatted `HTTP/1.1 ...` response.", "advanced": "`parse_subject(s)` decodes a URL-friendly subject key (`\"world\"`, `\"place:<id>\"`, `\"region:<hex>\"`) into a `RenderSubject`; `parse_style(app, s)` resolves a style by content-hash hex, by human name, or (when `None`) falls back to the first entry in `app.styles`, whose *ordering itself* is the default-style law (templates are sorted so a declared `default: true` template leads the list). `composed_scene()` is the real heart of the rendering pipeline shared by both `/api/render` and `/api/scene`: it supports a `pieces=` query for raw entity-level composition, a comma-separated multi-subject query composed via the `Snapshot`/`Monoid` `combine()` operation, an optional 'bible mode' (`scripture_only()`) that filters the world down to only Scripture-grounded regions/boundaries/markers while explicitly keeping the physical stage (seas, relief) unfiltered, and an optional ghost backdrop (`without_realized()` + `combine()`) so the un-selected rest of the world renders faded behind the focused subject without double-drawing anything already realized. The doc comment states the crate's 'DOGFOOD LAW' explicitly: request handlers may consume only the public contract (`dyn MapProvider`, `SceneEncoder`) — the same interface any external client would use — with zero privileged/internal access into the timeline, so the server can never accidentally rely on data shapes a real client couldn't also see. `PAGE` (`include_str!(\"page.html\")`) is the entire browser front-end compiled directly into the server binary and served verbatim at `/` — this file only serves it, and its own JavaScript/HTML internals are out of scope here. The server itself is `TcpListener::bind` plus `std::thread::spawn` per accepted connection (one OS thread per request, no async runtime), and every response is described as 'a pure function of (world, URL)' — which is exactly why a hash of the URL plus the app's `world_etag` can serve as a correct HTTP ETag for free client-side caching via `If-None-Match`/304.", "key_items": ["App struct — provider, styles/ghosts/overlay_tints, stops, ResourceStore, canon handle", "route()/route_text() — the giant match over URL paths answering every /api/* endpoint", "composed_scene() — pieces / multi-subject overlay / bible-mode filter / ghost backdrop, shared by render and scene routes", "parse_style() / parse_subject() — decode style and subject keys from query strings", "handle() + serve() — the raw TcpListener loop: manual HTTP parsing, ETag/If-None-Match caching, one thread per connection", "PAGE = include_str!(\"page.html\") — the whole browser UI compiled into the binary and served at '/'"]}, {"path": "crates/map-viewer/src/main.rs", "title": "Viewer binary entry point", "role": "The one-line executable that starts the workbench HTTP server by calling into the shared library crate.", "newbie": "Every runnable Rust program needs a `fn main()` — this is it, and it does almost nothing itself. All the real work lives in `lib.rs`; this file just says 'go run the server now.'", "intermediate": "`fn main() { map_viewer::serve() }` — the binary crate (`main.rs`) is deliberately kept to a single call into the library crate (`lib.rs`)'s `serve()` function, which is the pattern that lets `map-cli` (a separate binary) reuse the exact same `App`/`route()` logic without needing to spin up a TCP server at all.", "advanced": "This is the standard Rust 'thin binary, fat library' split: keeping `main.rs` trivial means the library crate's public functions (`load()`, `route()`, `serve()`) are independently testable and independently reusable by other binaries in the same workspace (here, `map-cli`) without any code duplication or awkward binary-to-binary calls.", "key_items": ["fn main() — calls map_viewer::serve() and nothing else", "Thin-binary pattern — real logic lives in lib.rs, reused by map-cli"]}, {"path": "crates/map-viewer/src/templates.rs", "title": "Style template loader (RON files)", "role": "Parses the `templates/*.ron` style-sheet files (a whole map 'look,' like colors, fonts, and stroke patterns) into validated map_types::style::Style values at server startup.", "newbie": "This is like loading a CSS theme file for a website, except the file format is RON (a Rust-flavored alternative to JSON) instead of CSS, and instead of just trusting the file, the code runs a battery of 'honesty' checks on it — for example, refusing to serve a theme where two visually-different concepts (like 'a disputed border' and 'a certain border') accidentally use the identical color and pattern, which would silently mislead anyone reading the map.", "intermediate": "A set of small `T*`-prefixed mirror structs (`TStroke`, `TRamp`, `TVoice`, `TLabel`, `TBoundaries`, ...) with `#[derive(serde::Deserialize)]` and `#[serde(deny_unknown_fields)]` describe exactly the shape a `.ron` file must have; `parse_template()` deserializes one file into a `Template`, then `build()` converts it field-by-field into a `map_types::style::StyleSpec` and calls `Style::new(spec)`, which is where the actual honesty-law validation happens (this file doesn't implement those laws, it just triggers them). `load_templates(dir)` reads every `*.ron` in a directory, alphabetically, parses and validates each one, and enforces that exactly one file declares itself `default: true`.", "advanced": "`deny_unknown_fields` turns any schema drift (a typo'd or removed field) into a loud, named parse error rather than a silently-ignored field — the tests confirm this with `unknown_fields_are_named_errors`. Font family strings are leaked to `'static` via `Box::leak(v.family.into_boxed_str())`, a deliberate, one-time-per-process memory leak justified by the comment: templates load exactly once at startup, and leaking keeps the whole `Style` tree `Copy` (cheaply duplicable by value) as the rendering code requires, rather than needing reference-counted or owned strings threaded everywhere. Both `load_templates` and its callers `panic!` loudly on any failure (missing directory, unparseable file, dishonest file, more than one declared default) — this is intentional fail-fast startup behavior: a broken style file should stop the server from booting at all, never serve a subtly-wrong map.", "key_items": ["T*-prefixed mirror structs — the exact RON schema, deny_unknown_fields for loud drift detection", "build() — converts a parsed Template into a StyleSpec, then Style::new() runs the honesty laws", "load_templates() — reads every *.ron alphabetically, panics loudly on any failure", "exactly-one-default enforcement — two files claiming default is a startup panic, never silent alphabetical fallback", "Box::leak for font family strings — a deliberate one-time leak so Style stays Copy"]}, {"path": "crates/map-viewer/src/bin/map-cli.rs", "title": "Serverless map-cli renderer", "role": "A second binary that reuses the exact same App and route() logic as the HTTP server to write rendered map artifacts (SVG/GeoJSON files) directly to disk, with no socket or running server involved.", "newbie": "Instead of standing at a counter serving one customer at a time (like the HTTP server does), this program cooks a whole batch of the owner's favorite maps ('the plate book' — Eden, the exodus route, the divided kingdoms, and so on) all at once and puts each one in a labeled container (a file named by a hash of its query) so they can be looked at later without needing the server running.", "intermediate": "`canonical_query()` sorts a query string's `key=value` parts so `\"year=-1000&zoom=8\"` and `\"zoom=8&year=-1000\"` produce identical output. `artifact_name()` hashes that canonical query together with a `world_pin` (a string identifying which version of the compiled world produced it) into a 16-hex-digit filename. `main()` either renders whatever queries are passed on the command line (`map-cli render <query>...`) or, with no arguments, renders the fixed `PLATES` list — the owner's named, curated set of Bible maps — writing each result plus a `manifest.json` describing the whole batch into `MAP_CLI_OUT` (default `out/artifacts`).", "advanced": "The key correctness property, exercised by `artifact_names_are_canonical`, is that the artifact filename is a pure function of (canonicalized query, world_pin): the SAME query against the SAME compiled world always produces the SAME filename with the SAME bytes, while re-vendoring the atlas (which changes the anchor frame/year baked into `world_pin`) renames every single artifact — making staleness visible rather than silently serving old data under an old name. Crucially, `main()` calls `map_viewer::load()` and `map_viewer::route(&app, \"/api/render\", &canonical)` — the identical function the HTTP server calls per-request — so there is exactly one implementation of 'turn a query into rendered bytes' in the whole codebase, with the socket-based server and the file-based CLI as two thin front ends over it.", "key_items": ["canonical_query() — sorts query params so param order never changes the artifact identity", "artifact_name() — content-addressed filename from (canonical query, world_pin)", "PLATES — the owner's curated, named set of canonical Bible map renders", "reuses map_viewer::load()/route() directly — zero duplicated rendering logic vs the HTTP server"]}]}, "map-types": {"role": "map-types is the shared vocabulary every other crate in the workspace speaks: pieces (the ten selectable layers a map is drawn from), scenes (styled geometry ready to paint), the timeline (who held what, when, and why it changed), geometry on the sphere, style-as-data, and the query/provider seam that answers 'draw this at year Y'. It defines almost no behavior of its own — map-adapters, map-partition, map-compile, map-canon, map-provider, and map-encoders all import these types and are expected to obey the laws (in laws.rs and the algebra traits) that make the whole pipeline composable rather than a pile of special cases. Because everything downstream speaks this vocabulary, a change here ripples through the entire atlas; that is why the file is full of recorded 'deliberate amendment' notes explaining exactly why each shape is the way it is.", "files": [{"path": "crates/map-types/src/lib.rs", "title": "The crate root — table of contents and the house rules", "role": "Declares every module in map-types, re-exports the public names other crates import, and re-exports a curated slice of the read-only atlas crate as `map_types::atlas`.", "newbie": "In Rust, a project's code is split into files called modules, and one file — usually named lib.rs — acts as the front door, listing which other files exist and which names from them the outside world is allowed to see (this is called 're-exporting'). This file is that front door for map-types. It does not do any map logic itself; think of it as the table of contents plus the reception desk of a library, pointing you to piece.rs for 'what a map is made of', scene.rs for 'a drawn picture', timeline.rs for 'history', and so on.", "intermediate": "The file is mostly `pub mod` declarations (one per source file) followed by `pub use` re-exports, so downstream crates can write `map_types::Piece` instead of `map_types::piece::Piece`. It also defines a small `atlas` module that re-exports specific types (Year, TimePoint, ContentHash, Confidence, etc.) from the external `atlas_graph_types` crate — a deliberate seam so no other crate in this workspace needs to depend on the atlas crate directly. The doc comment at the top states the crate's governing philosophy: types should make illegal states unrepresentable, traits should carry laws, and the actual compiled code — not the design prose — is the final authority when they disagree.", "advanced": "Note the `#![allow(dead_code)]` at crate level and the `#[cfg(test)] mod tests;` at the bottom — the real law-tests (monoid laws, morph safety, LOD monotonicity, encoder terminality) live in tests.rs and are compiled only for `cargo test`, while laws.rs holds the fail-loud *data* validators that run in production. The doc comment enumerates three explicit deviations from an original design sketch (MapKind mirroring rather than reusing the atlas's closed identity enum, Snapshot carrying boundaries/markers alongside regions, and RenderQuery collapsing two query types into one) — each is a place where the implementation diverged from spec and the divergence was written down for the owner to review rather than silently shipped. This module is also where cross-cutting invariants get enforced structurally: because everything is re-exported from one root, there is exactly one canonical path to each type, preventing the kind of duplicate/parallel type definitions that would silently break content-addressing.", "key_items": ["pub mod atlas — the only sanctioned window into the read-only atlas crate (Year, TimePoint, ContentHash, Confidence, Provenance, BibleLocus, ...)", "pub use piece::{Piece, PieceSet} — the ten-layer selection vocabulary re-exported at crate root", "pub use scene::{accumulate, sample_times, Snapshot, ...} — the semantic drawing re-exported at crate root", "pub use provider::{MapError, MapProvider, SubjectListing} — the query seam re-exported at crate root", "#[cfg(test)] mod tests — where the crate's algebraic/geometric laws actually get checked"]}, {"path": "crates/map-types/src/piece.rs", "title": "Pieces — what a map is made of", "role": "Defines the ten selectable layers of a rendered map (ground, water, fills, borders, claims, labels, markers, journeys, chrome, veil) and PieceSet, a compact set of them a caller can ask for or a scene can be filtered by.", "newbie": "Think of a paper map as a stack of transparent sheets you can lift on or off: one sheet for country borders, one for city names, one for rivers, and so on. In Rust, a fixed list of named options like this is called an 'enum' (short for enumeration) — `Piece` is that list of ten sheets. `PieceSet` is a small, efficient way to say 'I want these three sheets and not the other seven' without writing out a whole list every time; internally it packs the choice into the bits of a single number, the way a light switch panel packs ten switches into one strip.", "intermediate": "`Piece` is a `#[derive(...)]`-heavy C-like enum with a fixed `ALL` array, and `name`/`parse` functions that convert to and from human-readable strings like `\"borders\"`. `PieceSet` wraps a `u16` and uses one bit per piece (`bit()` computes the bit position from `Piece::ALL`'s order), giving cheap `with`, `without`, `contains`, and `union` operations. It also implements text rendering (`render`, using the literal token `\"none\"` for the empty set rather than an empty string, to avoid ambiguity with a malformed value) and parsing (`parse`, accepting `\"none\"`, `\"all\"`, or a comma-separated list). The doc comment explains the motivating bug: a prior `LayerSet` type lumped several concerns under one bit, so things that should have been independently toggleable weren't.", "advanced": "`PieceSet` is a monoid under `union` with `PieceSet::empty()` as identity (this is one of the laws proven in tests.rs), and `with`/`without` are meant to be exact inverses of each other for the affected bit — together these make the type a genuine little algebra rather than an ad hoc bitmask. `Piece::bit()` derives each variant's bit position from its index in `Piece::ALL` via `.position()`, so adding a new variant to both the enum and `ALL` is the only edit needed and the compiler enforces synchrony (`Piece::ALL.iter().position(...).expect(...)` panics loudly if someone forgets). All 2^10 = 1024 subsets are expected to round-trip through `render`/`parse` losslessly — this is exactly the property that lets `PieceSet` appear on the wire as `pieces=fills,borders` in a query string and be reconstructed exactly. This is the type that lets `Snapshot::restrict` (in scene.rs) implement 'render minus a piece' as a simple filter rather than a special case per layer.", "key_items": ["Piece — the closed ten-variant enum: Ground, Water, Fills, Borders, Claims, Labels, Markers, Journeys, Chrome, Veil", "PieceSet — a u16-backed bitset of Piece with empty/all/with/without/contains/union", "PieceSet::render / PieceSet::parse — lossless text round-trip, with \"none\" and \"all\" as sentinel tokens", "Piece::name / Piece::parse — the wire vocabulary for a single piece"]}, {"path": "crates/map-types/src/scene.rs", "title": "The Scene — a drawn picture with no opinion about pixels", "role": "Defines Snapshot, the fully-styled, format-free picture of a moment (or an accumulated span) — the last purely semantic type before an encoder turns it into bytes, SVG, or GPU buffers.", "newbie": "Once the system has decided what a map should look like at a given year — which countries exist, where the rivers are, what the labels say — it needs a neutral, in-memory description of that picture before it gets turned into an actual image format. `Snapshot` is that description: a list of styled regions (countries with their fill color), styled boundaries (lines), markers (dots for cities), and labels (names), plus a note of which historical sources it came from. It exists so the same picture-description can later be exported as SVG for a browser, or as GPU-ready shapes for 3D, without the picture logic caring which.", "intermediate": "`StyledRegion`, `StyledBoundary`, `StyledMarker`, `StyledInscription`, and `PlacedLabel` each carry fully-resolved geometry/paint plus a `piece: Piece` tag and a `sources: BTreeSet<SourceId>` for attribution. `Snapshot` bundles vectors of these plus a crate-wide `attribution` set, and implements the `Monoid` trait from algebra.rs: `empty()` is a blank scene and `combine` concatenates lists and unions attribution — this is literally what 'layer one map over another' means in this codebase. It also implements `MapAddressed` (from ident.rs), producing a canonical byte serialization used to content-hash a scene for caching. `Snapshot::restrict(keep: PieceSet)` filters every list by whether its `piece` is in the requested set, and `select_region`/`select_boundary` extract just one subject's contribution — both are used to prove that 'rendering X alone' agrees with 'picking X out of the whole-world render'.", "advanced": "Two free functions carry real algorithmic weight: `sample_times` computes the exact set of TimePoints needed to accumulate over an `Interval` — the endpoints plus every `ChangeEvent` strictly inside (and one at a closed end) — deduplicated and sorted, because the timeline is piecewise-constant and uniform time-ticks would alias (missing a short reign, or wastefully re-sampling an unchanged century). `accumulate` folds a sequence of `Snapshot`s into one via `mconcat`, but first deduplicates by `map_pid()` (content hash) using a `BTreeSet` — so two textually-identical snapshots collapse to one contribution, which is precisely what makes adding a redundant sample between two change events a no-op (this is 'law 9' referenced in the comments). `Snapshot::canonical_bytes` is notable for hashing the `piece` field of every element: the comment explicitly flags this as a place a prior bug hid — two scenes differing only in which piece an element belongs to must hash differently, or content-addressed caching would silently merge them. `restrict` is defined as a definition, not an approximation, of 'render minus a piece' (spec law 1) specifically because every element already carries its own piece and sources.", "key_items": ["Snapshot — the whole scene: regions, boundaries, markers, inscriptions, labels, attribution", "impl Monoid for Snapshot — combine draws `other` over `self`; empty scene is the identity", "Snapshot::restrict(keep: PieceSet) — 'scene minus a piece' as an exact filter, not an approximation", "sample_times(over, events) — the exact, non-aliasing sample points for an accumulation", "accumulate(snapshots) — content-address-deduped fold across an interval's distinct snapshots", "StyledRegion / StyledBoundary / StyledMarker / PlacedLabel — the fully-resolved, piece-tagged, source-attributed drawable elements"]}, {"path": "crates/map-types/src/geom.rs", "title": "Geometry on a sphere — points, rings, and 'is this inside that'", "role": "The spherical geometry kernel: unit vectors as points on the globe, slerp interpolation, closed rings, polyline simplification, and true point-in-ring containment on a sphere.", "newbie": "Because this atlas is a globe, not a flat piece of paper, every location is stored as a point on the surface of a mathematical sphere (an 'x, y, z' triple whose length is always exactly 1) rather than a flat latitude/longitude pair — this avoids the distortion and edge-case bugs that come from treating a round world as flat. This file provides that point type (`UnitVec`) and the operations built on it: smoothly animating between two points along the globe's surface (`slerp`, short for spherical linear interpolation — like a great-circle flight path), simplifying a wiggly coastline into fewer points without losing its shape (`simplify_polyline`), and answering the surprisingly tricky question 'is this city inside that country's border?' (`inside_ring`) — tricky because on a sphere there's no obvious 'outside' the way there is on a flat page.", "intermediate": "`UnitVec` is a small struct with a validating constructor (`new`, which rejects non-unit-length input) and a normalizing one (`normalize`), plus geographic conversions (`from_lat_lon_deg`/`to_lat_lon_deg`), dot/cross products, and `angle_to` (the sphere's native distance metric). `slerp` is total except for exactly-antipodal inputs, which return `GeomError::Antipodal` because there's no unique shortest path between opposite points on a globe — callers must resample rather than guess. `Ring` is a closed polygon boundary (>=3 points, first point not repeated) with a `winding()` method computed from a centroid-relative cross-product sum. `simplify_polyline` implements Douglas-Peucker simplification adapted to great-circle arc distance (`arc_distance`) rather than planar distance, and `morph_rings` pairwise-slerps two same-length rings for smooth topology-preserving animation.", "advanced": "The file's centerpiece is the point-in-ring containment law occupying its second half: because a closed simple curve on a sphere has no natural 'outside' (unlike the plane, which has a point at infinity), the code adopts and documents an explicit convention — the interior is the ring's smaller-area component, ties broken to the left of traversal — and implements it two ways. `inside_ring` takes a fast path when the ring fits inside a spherical cap smaller than a hemisphere (`ring_cap` computes the vertex-mean axis and angular radius; then the axis's antipode is a guaranteed-outside reference point, and even-odd crossing parity against `outside_reference` decides membership). When no such cap exists, `inside_ring_general` falls back to a full parity computation that labels the two components using spherical Gauss-Bonnet turning angles (`turn` accumulated from tangent vectors at each vertex) to decide which side has area <= 2*pi, then determines the query point's side relative to a reference chosen to avoid near-antipodal degeneracies. `covers_sphere` recognizes a special sentinel: a ring of at most 5 points containing a near-antipodal pair, whose interior is defined to be the entire sphere (used to represent the world ocean as 'everything minus the land', with no fictitious envelope boundary) — `inside_ring` special-cases this before doing any real geometry. `arcs_cross` (the crossing-test primitive) explicitly notes its robust tie-break at shared endpoints so that a geodesic passing exactly through a ring vertex is counted consistently. `Lod` (level of detail) and `simplify_polyline` are built so that a coarser tolerance's kept-point set is provably a subset of a finer tolerance's — 'LOD monotonicity' — which the crate's tests verify directly.", "key_items": ["UnitVec — a point on the unit sphere, validated or normalized at construction; never renormalized defensively downstream", "slerp(a, b, t) — spherical linear interpolation, total except at antipodes", "Ring / Winding / morph_rings — closed spherical polygons and their pairwise-slerp animation", "inside_ring(p, ring) — sound point-in-polygon on a sphere via the smaller-area-component convention", "simplify_polyline(pts, lod) — Douglas-Peucker on great-circle arc distance, monotonic in tolerance", "covers_sphere(pts) — recognizes the whole-sphere sentinel ring (e.g. the world ocean)"]}, {"path": "crates/map-types/src/style.rs", "title": "Style — how things look, as pure data", "role": "Defines Style and its pieces (colors, strokes, label typography, chrome, ghosting, patterns) as validated, content-addressed data, with no rendering code baked in.", "newbie": "A 'style' here means every visual choice about the map — what color a country is filled, how thick a border line is, what font a label uses, how faded the 'background' looks when one place is highlighted — bundled into one reusable value instead of scattered constants inside drawing code. This file defines that bundle (`Style`) and enforces a couple of honesty rules when it's built: for example, an 'unknown' border (where historians genuinely don't know where the line was) is not allowed to look identical to a confidently-known border, because that would quietly lie to the map's reader.", "intermediate": "`Style` is built only through `Style::new(spec: StyleSpec)`, which validates several invariants (an 'Unknown' boundary stroke must differ from the 'Line' stroke; a 'Frontier' edge must use the `Zonal` stroke pattern, i.e. a soft band, not a crisp line; various numeric dress factors like alphas and widths must be finite and in-range) and returns `Result<Self, StyleError>` — so a dishonest or malformed style simply cannot exist as a value. `StyleSpec` groups everything by name (boundary strokes, region/water paint, an `AgeRamp` for accumulation shading, an optional 8-color `palette` for making adjacent territories distinguishable, a `Labeling` bundle covering four `TypeVoice`s — Territory/Water/Place/Memory — plus a `LabelScale` law for how label size responds to area) so growing the style never means adding another positional constructor argument. `Style` implements `MapAddressed`, hashing every field it exposes into a `StyleId`, so changing any visual dress produces a new cache key rather than silently reusing stale renders.", "advanced": "The `canon` method is the crate's sharpest edge in this file: it must hash literally every field a renderer can read, and the doc comment records that this file's history includes real regressions where a field (stroke width, a label voice, the scaling law) was invisible to hashing, causing two different-looking styles to collide into one `StyleId` — silently discarding one of them from a style table. This makes `canon` a place where adding a new stylable field is a two-step obligation (add to `StyleSpec`/`Style` AND add to `canon`), unenforced by the type system, so it is the one spot in the crate relying on developer discipline rather than a law test. `Labeling::voice(face: LabelFace)` maps a semantic face (Territory/Water/Place/Memory) to a `TypeVoice`, keeping typography choices data-driven rather than hardcoded per renderer. `VEIL` is a crate-wide constant, deliberately not a per-style field, encoding the design decision that the 'dim everything except my selection' overlay is a property of attention, not of a particular visual template — so no style can opt out of a consistent focus effect. `GhostDress` and `PatternGeometry` exist because their factors (stroke/fill alpha multipliers, dash rhythms, zonal band proportions) were previously hardcoded constants duplicated across renderers, and moving them into `Style` means every terminal encoder reads one source of truth instead of drifting.", "key_items": ["Style::new(spec: StyleSpec) -> Result<Style, StyleError> — the only constructor; enforces honesty laws (Unknown != Line, Frontier is Zonal)", "Style::canon — hashes every visible field into content-addressed identity (StyleId); the crate's most failure-prone spot for new fields", "StyleSpec — the one named-field argument bundling boundaries/paint/labeling/chrome/ghost/pattern", "Labeling / TypeVoice / LabelScale — data-driven label typography and area-responsive sizing", "VEIL — the one focus-dimming ink shared by every style, deliberately not per-template", "StyleError — UnknownIndistinctFromLine, FrontierNotZonal, DressOutOfRange(name)"]}, {"path": "crates/map-types/src/timeline.rs", "title": "The timeline — history as deltas, not snapshots", "role": "Models the map's history as change events and piecewise-constant version intervals (WorldTimeline), from which any moment's picture is derived rather than hand-authored.", "newbie": "Instead of someone drawing a separate map for every single year (which would be an enormous, error-prone amount of manual work), this file lets the system store history as a list of *changes* — 'this border shifted here', 'this kingdom fell there' — each stamped with when it happened. The map for any specific year is then computed automatically by asking 'what does the world look like after applying every change up to this date', the same way you can figure out your bank balance from a list of transactions rather than needing someone to write down the balance every single day.", "intermediate": "`Interval` (from, to: Option<TimePoint>) models validity with a half-open convention — `[from, to)` — so consecutive versions of the same thing tile time without gaps or double-covering, and `to: None` means 'still current'. `BoundaryHistory` and `RegionHistory` are each a `Vec<(Interval, T)>` with an `at(t)` lookup that finds the interval containing a given time. `ChangeKind` is an enum of the honest verbs history can perform — Rise, Fall, Shift, Split (with an explicit seam), Merge, Rename, Journey — deliberately distinct from a generic 'update', so e.g. an empire fragmenting is recorded as `Split`, never as continuous drift. `ChangeEvent` bundles a `ChangeKind` with its time, an optional link to the driving Scripture-attested atlas event (`AtlasEventRef`), a `Justification`, and provenance, and implements `MapAddressed` so every narrated change has a stable, hashable identity usable as its own render subject. `WorldTimeline` is the aggregate: boundary/region histories keyed by id, the event list, an optional creation-style `Anchor`, and an `AtlasPin` recording which version of the upstream atlas data this timeline was compiled against.", "advanced": "`Anchor` is deliberately frame-generic (a `String` name plus a `TimePoint`, `Justification`, and provenance) so that a biblical chronology and a rival secular one could each declare their own starting point and be compared as data rather than one being hardcoded truth — which frame is correct is a doctrinal/editorial decision, not something the type system adjudicates; law 0 (enforced in laws.rs) only guarantees nothing in a timeline predates its own declared anchor. `ChangeEvent`'s `driver: Option<AtlasEventRef>` plus the `Justification`/`Ground` canonicalization (`canon_justification`) implements the 'Bible preference' authority ladder: when a change is driven by a Scripture-attested atlas event, its `at` must exactly equal the atlas's resolved placement (checked in laws.rs, not here) — the map never re-derives a date the text already fixes. `AtlasPin::is_stale(current)` is the mechanism behind contract C6: rather than silently serving borders computed against an outdated version of the upstream atlas, a mismatched `version_root` is meant to fail loud. Note that `RegionHistory` and `BoundaryHistory` intentionally do NOT self-validate disjointness/ordering here — that's a fail-loud concern delegated entirely to `laws::validate_history_coherence`, keeping this file about shape and laws.rs about correctness.", "key_items": ["Interval — half-open [from, to) validity window; `to: None` means still-current", "ChangeKind — Rise/Fall/Shift/Split/Merge/Rename/Journey: named verbs, not generic diffs", "ChangeEvent — a narrated, content-addressed, provenance-carrying border/region change", "WorldTimeline — the aggregate: histories + events + optional anchor + atlas pin", "Anchor — a frame-generic declared starting point (e.g. Creation) that history cannot precede", "AtlasPin::is_stale(current) — the C6 staleness check against the upstream atlas version"]}, {"path": "crates/map-types/src/boundary.rs", "title": "Boundaries and regions — shared borders, honestly typed", "role": "Defines the shared-arc boundary model (EdgeCharacter, Boundary, BoundarySource) and region geometry built from oriented boundary cycles (RegionPart, RegionGeom), so neighboring territories reference one border instead of two near-duplicate ones.", "newbie": "When two ancient kingdoms shared a border, this system stores that border as one single shared line that both kingdoms point to, rather than each kingdom drawing its own copy of roughly the same line — the way two neighboring properties on a survey map share one fence line, not two overlapping fences. This avoids ugly little gaps or overlaps ('slivers') between countries, means a historian only has to correct the line once, and means an animated border move drags both neighbors together automatically. `EdgeCharacter` also makes the map honest about uncertainty: a border can be marked as a real known line, a fuzzy zone of control, disputed by multiple claimants, or simply unknown — and the drawing code is never allowed to just guess a crisp line where scholars don't actually know one.", "intermediate": "`EdgeCharacter` is an enum (Line, Frontier{width_km}, Disputed{claimants}, Unknown, Way) that style.rs is required to render distinctly per-variant (see the honesty laws in Style::new). `Boundary` holds the actual point list (`pts: Vec<UnitVec>`), its `EdgeCharacter`, a `BoundarySource` (Survey, Imported, or Authored — an explicit authority ladder: Scripture-derived surveys first, imported scholarship second and always labeled, authored geometry always justified), plus `Justification` and `ProvenanceId`. `BorderSurvey` models literal Biblical border descriptions (Numbers 34, Joshua 15-19) as a sequence of gazetteer waypoints (`AtlasPlaceRef`) joined by a disclosed `InterpolationMethod` (Geodesic, TerrainValley, or Coast) — the geometry is constructed from the text, not merely inspired by it. `RegionPart` is one connected piece of a region's shape: an outer cycle of `(BoundaryId, Orientation)` references (which way the region walks the shared arc) plus hole cycles, and `RegionGeom` is a `Vec<RegionPart>` because real polities (a mainland plus islands) are routinely multi-part.", "advanced": "`RegionPart`'s empty-cycle convention is a load-bearing sentinel: an empty outer `cycle` means 'the whole sphere minus the holes', which is how the world ocean is represented without inventing a fictitious enclosing boundary — `geom::covers_sphere` and `inside_ring` are the geometry-side machinery that recognizes and handles this case. Correctness of a region's shape is only half-checked at the type level; `laws::validate_partition_structure` walks every cycle's oriented boundary references and asserts (a) each boundary id resolves to a real, live-at-that-interval `Boundary` (`DanglingBoundary` otherwise), and (b) consecutive oriented arcs connect exactly end-to-start with byte-for-byte-equal junction coordinates, no epsilon tolerance, because shared arcs are expected to carry identical coordinates at their shared endpoints by construction (`BrokenCycle` otherwise). `BoundarySource::Survey` participates in the 'Bible preference' law (12b/12c in laws.rs): an `Imported` version of the same arc may not overlap a `Survey` version's validity window (scholarship must not silently override attested text — ending a survey requires a narrated `ChangeEvent`), and every survey waypoint must resolve to a real, live gazetteer place. `Orientation` (Forward/Reverse) is what lets one physical `Boundary` serve two neighboring regions that walk it in opposite directions around their respective interiors.", "key_items": ["EdgeCharacter — Line/Frontier/Disputed/Unknown/Way: honesty about how well a border is actually known", "Boundary — the shared arc's points, character, source, justification, and provenance", "BoundarySource — Survey/Imported/Authored: the authority ladder for where geometry came from", "BorderSurvey — a Biblical border literally constructed from cited verses and gazetteer waypoints", "RegionPart / RegionGeom — a region as one or more cycles of oriented shared-boundary references, with the empty-cycle 'whole sphere' sentinel"]}, {"path": "crates/map-types/src/ident.rs", "title": "Identity — giving everything a name derived from its own contents", "role": "Implements content-addressed identity for the map system: MapKind, MapPid, the MapAddressed trait, and the Canon byte-writer used to hash values deterministically.", "newbie": "Instead of assigning arbitrary ID numbers to things (which could accidentally collide, or need a central registry to hand them out), this system computes an ID by hashing the *content* of the thing itself — like how a book's ISBN is unofficially assigned, but a file's checksum is derived purely from its bytes, so two identical files always get the same checksum and two different files (almost) never do. This file provides the machinery for that: turning any value into a consistent sequence of bytes (`Canon`), then hashing those bytes into an ID. It exists so that caching and comparison never rely on trusting some external bookkeeping — identity is a mathematical fact about the value.", "intermediate": "`MapKind` is a closed enum (Region, Boundary, ChangeEvent, Style, Query, Scene, Timeline) tagging what category of thing an id refers to, and `MapPid` pairs a `MapKind` with a `ContentHash`. The `MapAddressed` trait requires implementors to provide `canonical_bytes()` (a deterministic byte serialization) and `map_kind()`, and supplies a default `map_pid()` that hashes those bytes with `DefaultHasher` (Rust's standard, not cryptographic, hasher — explicitly called out as a placeholder 'stand-in for a real multihash'). `Canon` is a small byte-buffer writer with typed helpers (`u8_`, `u64_`, `i32_`, `f64_`, `str_`, `opt`, `seq`) that every `canon`/`canonical_bytes` implementation across the crate calls into, guaranteeing that every field is length-framed and tagged so that concatenation can never make two different values hash to the same bytes.", "advanced": "`Canon::f64_` canonicalizes floats by raw bit pattern (`to_bits()`) rather than value comparison, deliberately avoiding epsilon tolerance or locale-dependent formatting — two floats hash identically iff they are bit-identical, which matters because content-addressing must be exact, not 'close enough'. `Canon::str_`/`seq` always write a length prefix before the payload, which is what prevents concatenation ambiguity (e.g. two adjacent strings 'ab'+'c' vs 'a'+'bc' would hash identically without length framing). The `content_ids!` macro mechanically generates the newtype id structs (`RegionId`, `BoundaryId`, `ChangeEventId`, `StyleId`) that just wrap a `ContentHash`, keeping each id type distinct even though they share representation — this is the standard Rust 'newtype pattern' used purely to prevent mixing up, say, a `RegionId` and a `BoundaryId` at the type level even though both are really just a u64 hash underneath. The crate-root doc comment records that this whole module is a deliberate, temporary mirror of a discipline the upstream atlas crate already implements for its own closed node-kind enum; because this repo is forbidden from editing the atlas repo and the atlas's kind enum can't represent map-specific kinds like Style or Scene, map-types re-implements the same one-canonical-byte-form-plus-hash idea independently, with the expectation that the mirror collapses into direct reuse once the atlas exposes a compatible interface.", "key_items": ["MapAddressed trait — canonical_bytes() + map_kind() with a default map_pid() hashing implementation", "Canon — the deterministic, length-framed byte writer every canon() method funnels through", "MapKind / MapPid — the closed kind vocabulary and the (kind, hash) identity pair", "content_ids! macro — generates RegionId/BoundaryId/ChangeEventId/StyleId as distinct newtypes over ContentHash"]}, {"path": "crates/map-types/src/query.rs", "title": "RenderQuery — the one front door for asking the map to draw something", "role": "Defines RenderSubject (anything askable — a point, a border, a region, a delta, or the whole world), TimeSelector (an instant or an interval), and RenderQuery, the single content-addressed request type consumed by MapProvider.", "newbie": "Instead of having a different function call for 'draw one country', another for 'draw one border', another for 'draw the whole world at this date', this file defines one universal request shape — like a single order form at a restaurant that can specify anything from 'just the soup' to 'the whole tasting menu'. `RenderQuery` is that order form: what subject you want drawn, at what time (or over what span of time), from what zoomed-in area, at what level of detail, which layers/pieces, and in which visual style. Because the whole request is one value, it can be hashed to produce a cache key — asking the exact same question twice can reuse the same cached answer instead of recomputing it.", "intermediate": "`RenderSubject` is an enum covering every renderable thing in the system: `Point`/`RawPoint` (a gazetteer place vs an arbitrary coordinate), `Boundary`, `Region`, `RegionTerrain` (a region clipped over relief), `Change` (a delta/event), and `World`. `TimeSelector` unifies the two conceptually different query modes — `At(TimePoint)` for an instantaneous snapshot and `Over(Interval)` for a long-exposure accumulation — into one type, so a provider's `render` method doesn't need two separate entry points. `RenderQuery` bundles the subject, the time selector, an optional `viewport: Option<Bbox>` (None meaning 'auto-frame to the subject'), a `Lod`, a `PieceSet` of requested layers, and a `StyleId`. It implements `MapAddressed`, so the query hash literally IS the cache key / artifact filename — described in the doc comment as 'the whole offline story'.", "advanced": "The `canonical_bytes` implementation is a careful example of tagged-variant canonicalization: each `RenderSubject` variant gets a distinct leading `u8_` tag (0 through 6) before its payload, and similarly `TimeSelector::At`/`Over` are tagged 0/1, so that no two semantically different queries can ever produce colliding byte sequences purely by chance concatenation. Notably, the code comments on a minor representational compromise: `Canon` has no dedicated `u16_` method, so the 10-bit `PieceSet` is widened into a `u64` via `u64::from(self.pieces.bits())` rather than inventing a new Canon primitive just for this one call site — a small, explicitly-justified pragmatic shortcut rather than a silent one. Because `RenderQuery` is the sole parameter to `MapProvider::render`, this file is effectively the seam contract (C5) between the query layer and everything downstream; any new capability the system needs to expose (a new subject kind, a new time mode) must be added here as a new tagged variant, which is a good divergence point to watch when the pipeline grows.", "key_items": ["RenderSubject — Point/RawPoint/Boundary/Region/RegionTerrain/Change/World: everything the system can be asked to draw", "TimeSelector — At(instant) vs Over(interval), unifying snapshot and accumulation queries", "RenderQuery — subject + time + viewport + lod + pieces + style, content-addressed as its own cache key", "impl MapAddressed for RenderQuery — tagged-variant canonical byte encoding"]}, {"path": "crates/map-types/src/provider.rs", "title": "MapProvider — the contract answering 'draw the scene at year Y'", "role": "Declares the MapProvider trait (the query seam, contract C5) that turns a RenderQuery into a Scene, plus MapError and SubjectListing supporting it.", "newbie": "A 'trait' in Rust is a promise about behavior — a checklist of methods something must implement, without saying how, so different implementations can be swapped in as long as they keep the promise (similar to a job description that any qualified applicant could fulfill in their own way). `MapProvider` is the checklist that describes 'anything capable of answering map questions': it must be able to list what subjects exist at a given time, actually render a query into a picture, describe an animation between two times, and list what changed between two times. This file doesn't implement a provider itself — the map-provider crate does that — this is just the agreed-upon shape of the answer, frozen so that both this project and the upstream atlas project can build against it independently.", "intermediate": "`MapProvider` has four required methods: `subjects(at) -> Vec<SubjectListing>` (an enumeration/picker feed), `render(&RenderQuery) -> Result<Snapshot, MapError>` (the one universal render call), `transition(from, to, viewport, lod) -> Result<TransitionScript, MapError>` (a semantic animation), and `changes_between(from, to) -> Vec<&ChangeEvent>` (the narrative timeline exposed for scrubber UIs). `MapError` is an explicit, enumerated failure set (UnknownRegion/Boundary/Change/Style/Place, NothingAtTime, TerrainUnavailable, StaleAgainstAtlas{pinned, current}) rather than a generic string error, so callers can pattern-match and react precisely — e.g. `StaleAgainstAtlas` corresponds directly to `AtlasPin::is_stale` in timeline.rs and is meant to fail loudly rather than silently serve outdated borders.", "advanced": "This file is explicitly called out in its doc comment as 'THE SEAM (contract C5, co-owned with the atlas)' — frozen with the project owner before any serving implementation exists on either side, which is why it lives in map-types (the shared vocabulary crate) rather than in map-provider itself: both sides of the seam need to agree on this shape without depending on one particular implementation. The `transition` method carries two laws referenced in comments but enforced elsewhere (in tests.rs): `transition(t, t)` must be the empty script, and composing two transitions must agree with the single direct transition covering the same span — these are the associativity/identity laws of `TransitionScript`'s `Monoid` implementation (transition.rs) applied at the seam level. `subjects` is noted as having joined the trait in 'phase 4' specifically because any UI consuming this seam — whether built by this project or by the atlas team — needs an enumeration step before it can construct a `RenderQuery`, which is a good example of the trait's shape evolving in response to a concrete downstream need rather than being speculatively complete from day one.", "key_items": ["MapProvider trait — subjects / render / transition / changes_between: the whole query seam", "MapError — UnknownRegion/Boundary/Change/Style/Place, NothingAtTime, TerrainUnavailable, StaleAgainstAtlas", "SubjectListing — one enumerable (subject, label) row for a picker UI"]}, {"path": "crates/map-types/src/laws.rs", "title": "Fail-loud validators — the data laws, actually checked", "role": "Runs a suite of validators over a WorldTimeline (anchor ordering, history coherence, provenance totality, partition structure, Bible-preference authority, referential integrity), returning a typed, enumerable list of Violations rather than a boolean or a panic.", "newbie": "Even with careful types, some rules are about *relationships between* pieces of data rather than the shape of one piece alone — for example, 'a border's history shouldn't have two overlapping time periods' can't be caught just by looking at one border in isolation. This file is where those cross-checking rules live, run as real functions instead of just being written down as a comment somewhere and hoped for. Crucially, when something is wrong, the code doesn't just say 'error' — it returns a specific, named reason (a `Violation`) so a human (or another program) can see exactly what broke and where, rather than just a generic red X.", "intermediate": "`Violation` is a large enum with one variant per rule, each carrying the specific offending data (e.g. `BeforeAnchor{what, at}`, `IncoherentIntervals{what}`, `DanglingBoundary{region, boundary}`, `DriverDateMismatch{event, map_at, atlas_from}`). Each validator function (`validate_anchor`, `validate_history_coherence`, `validate_provenance_totality`, `validate_partition_structure`, `validate_bible_preference`, `validate_event_refs`) walks the `WorldTimeline` (and, for the Bible-preference check, the atlas's `ChronologyExport`/`GazetteerExport`) and appends every violation it finds to a `Vec` rather than stopping at the first one, so a single validation pass surfaces the complete picture. `validate_all` simply chains all of them and returns the concatenated list — an empty vector is the one 'everything is fine' state.", "advanced": "`validate_partition_structure`'s `validate_cycle` helper resolves each boundary reference in a region's outer/hole cycles to its geometry *as valid at the interval's start* (`BoundaryHistory::at(&interval.from)`), then checks end-to-start continuity between consecutive oriented arcs using exact equality on `UnitVec` junction coordinates — no epsilon tolerance — because the design guarantees shared arcs carry bit-identical coordinates at shared endpoints by construction, so any mismatch is a genuine authoring bug, not floating-point noise. `validate_bible_preference` implements the project's core authority ordering as executable checks rather than policy prose: (a) a driven `ChangeEvent`'s date must exactly equal one of the two endpoints of the atlas's resolved placement for that event (`e.at != p.date.from && e.at != p.date.to`) — allowing a span-shaped placement like 'siege..fall' to be realized at either boundary but never at an invented interior date; (b) an `Imported` boundary version may never time-overlap a `Survey` version on the same arc, because scholarship is not allowed to silently override attested Scripture-derived geometry — ending a survey's validity must instead be a narrated `ChangeEvent`; (c) every survey waypoint must resolve to a place actually present in the gazetteer export. `validate_anchor` is notably permissive-by-default: a timeline with no declared `Anchor` passes vacuously, because the guarantee ('nothing precedes this point') is only bought by the timeline actually declaring one — this is a deliberate 'opt-in strictness' pattern rather than the more common 'opt-out'.", "key_items": ["Violation — the enumerated, typed catalog of everything a WorldTimeline can get wrong", "validate_all(tl, chronology, gazetteer) -> Vec<Violation> — runs every check; empty result is the lawful state", "validate_partition_structure — proves shared-boundary cycles connect end-to-start with no epsilon, catching sliver-causing bugs", "validate_bible_preference — enforces the Scripture-first authority ladder as exact date/overlap/resolution checks", "validate_anchor — opt-in: an undeclared anchor passes vacuously; a declared one bars anything predating it"]}, {"path": "crates/map-types/src/algebra.rs", "title": "Monoid — the one composition rule the whole system reuses", "role": "Defines the Monoid trait (an identity value plus an associative combine operation) and mconcat, the generic fold used to combine any sequence of monoid values — the algebraic backbone behind scene overlay and transition sequencing.", "newbie": "A 'monoid' is a slightly technical-sounding math word for something you've almost certainly used without naming it: an empty starting point, plus a way to combine two things into one, where combining doesn't care what order you group them in (like adding numbers: 0 is the empty starting point, and (1+2)+3 gives the same answer as 1+(2+3)). This file defines that pattern once, generically, in Rust as a `trait` (a checklist of required behavior), so that both 'layer maps on top of each other' (in scene.rs) and 'chain animations one after another' (in transition.rs) can reuse the exact same combining logic instead of each reinventing it slightly differently and risking subtle inconsistencies.", "intermediate": "`Monoid` requires two methods: `empty() -> Self` (the identity element) and `combine(self, other: Self) -> Self` (the associative operation). `mconcat` is a free function that folds any `IntoIterator` of monoid values down to one, starting from `M::empty()` — a two-line generic implementation (`xs.into_iter().fold(M::empty(), M::combine)`) that works for any type implementing the trait. The doc comment names the two current implementors directly: `Snapshot` under overlay (scene.rs) and `TransitionScript` under sequencing (transition.rs), and explicitly ties each to the numbered design laws they satisfy.", "advanced": "This trait is deliberately minimal — it does not itself enforce associativity or the identity laws; those are proven separately as property tests in tests.rs ('a trait without law tests is just hope', per the doc comment), which is a notable design choice: the type system alone cannot verify algebraic laws like associativity in Rust, so the crate treats `Monoid` as a *documented contract* backed by executable proof rather than something the compiler guarantees. `mconcat`'s generic signature (`impl IntoIterator<Item = M>`) is what lets `scene::accumulate` and any future monoid-consuming code accept a `Vec`, an iterator, or any other collection uniformly. Architecturally, this is the single point of leverage that makes 'overlay maps in a clean fashion' (scene composition) and 'composed transitions agree with the direct transition' (animation composition) provably the same *kind* of guarantee rather than two independently-hoped-for behaviors — a bug fixed in one law test's reasoning about monoids transfers understanding to the other implementor for free.", "key_items": ["Monoid trait — empty() + combine(self, other) -> Self", "mconcat(xs) — generic fold of any monoid-valued iterable down to one value", "Snapshot (scene.rs) and TransitionScript (transition.rs) — the two current implementors"]}, {"path": "crates/map-types/src/chart.rs", "title": "Chart — translating a flat map plate onto the globe, invertibly", "role": "Defines Chart, an affine, invertible mapping between a rectangle of pixels on a flat source image (a scanned historical map plate) and a patch of the sphere, so any two flat sources can be compared by going through the sphere.", "newbie": "Old historical maps and modern georeferenced plates are flat images, but this atlas's true 'home' representation is a round globe (see geom.rs). A `Chart` is the translator between one specific flat image and the globe: give it a pixel coordinate on that image, it tells you the corresponding point on the sphere, and vice versa. It's called a 'Chart' deliberately in the mathematician's sense used for atlases (a book of maps): the sphere is the one true globe, and every flat page is just one local, invertible view of a patch of it — which is also literally why a folder of maps is called an 'atlas'.", "intermediate": "`Chart` stores a 2x2 affine matrix `a`, an offset `b`, and a `domain` rectangle in the source image's own pixel coordinates; `Chart::new` rejects a degenerate (non-invertible, i.e. area-collapsing) matrix by checking its determinant against a small epsilon. `to_sphere(x, y)` applies the affine transform to get longitude/latitude in degrees, then builds a `UnitVec` via `from_lat_lon_deg`, returning `None` if the input point falls outside the chart's declared `domain` (a chart claims nothing beyond its own frame). `from_sphere(p)` does the inverse: converts the sphere point back to degrees, solves the affine system for the pixel coordinates via Cramer's rule using the matrix's determinant, and again returns `None` if the result falls outside `domain`.", "advanced": "The design deliberately restricts `Chart` to an affine (not a full projective or curved) mapping, justified in the doc comment as exact enough for plates whose projection is locally flat at their scale, with any residual distortion tracked separately by the data producer as an honesty figure rather than silently absorbed into the math. `contains` adds a small domain-relative epsilon (`1e-9 * perimeter-ish scale`) specifically so that floating-point roundoff from a `to_sphere`/`from_sphere` round trip can't spuriously evict a point that lands exactly on the domain's edge — a concrete instance of the crate's general discipline of choosing tolerances deliberately rather than accidentally. The module's own test suite (in a `#[cfg(test)] mod chart_laws` block, unusually embedded directly in this file rather than centralized in tests.rs) proves the chart's actual mathematical contract: plane-to-sphere-to-plane round-trips to high precision, sphere-to-plane-to-sphere round-trips similarly, out-of-frame points are correctly rejected on both sides, degenerate matrices are refused at construction, and — the most structurally important property — two independent charts compose correctly through the sphere (plate -> sphere -> screen equals what you'd expect from direct affine composition), which is the property that actually justifies treating the sphere as the single canonical coordinate system every flat source ultimately agrees through.", "key_items": ["Chart::new(a, b, domain) — an affine, invertibility-checked plane<->sphere mapping over a declared pixel rectangle", "Chart::to_sphere(x, y) / Chart::from_sphere(p) — the forward/inverse mapping, None outside the chart's own frame", "ChartError::Degenerate — refuses a matrix that collapses the plane (no valid inverse)", "chart_laws test module — proves round-trip fidelity and that independent charts compose correctly through the sphere"]}, {"path": "crates/map-types/src/contracts.rs", "title": "Atlas import contracts — what the upstream chronology and gazetteer promise", "role": "Defines ChronologyExport and GazetteerExport (plus their entry types), the read-only data shapes this project imports from the upstream atlas project as the authority for dates and place coordinates.", "newbie": "This project depends on a separate, read-only upstream project (called 'the atlas') for two crucial kinds of ground truth: when things happened (chronology) and where places are located (a gazetteer, which is just a fancy word for a dictionary of place names and coordinates). This file defines the exact shape of the data this project is allowed to import from that upstream source, and the comment at the top is explicit that authority only flows one direction: the atlas's data is trusted as-is, and this project is never supposed to recalculate or override it.", "intermediate": "`ChronologyExport` bundles the atlas's own version identifier (`atlas_root: ContentHash`, used elsewhere for staleness checks), a map from `EventId` to `ResolvedPlacement` (the atlas's traditional, creation-anchored chronology — the actual dated placements referenced by `ChangeEvent::driver` in timeline.rs), and a `Vec<ChronoSpan>` for era/reign-width dates that the text only supports at span granularity rather than as false precise years. `GazetteerExport` maps `PlaceId` to `GazetteerEntry`, and each entry carries not just a `canonical_name` and `position: UnitVec` but also `aliases`, optional `provenance`, and a list of `attestations` — all `Option`/`Vec`-typed so that genuinely absent metadata stays absent rather than being papered over with a fabricated default.", "advanced": "These two export types are the concrete data this project's `laws::validate_bible_preference` function checks against: a `ChangeEvent`'s driven date must land on one of `ResolvedPlacement`'s two endpoints, and every `BorderSurvey` waypoint (boundary.rs) must resolve to a key present in `GazetteerExport::places`. The doc comment's phrase 'provenance bible-atlas@(version-root)' signals that when these exports are consumed as adapter sources elsewhere in the pipeline (map-adapters), each fact pulled from them should be tagged with a provenance string embedding the exact atlas version it came from — tying every date and coordinate transitively back to a specific, reproducible upstream snapshot via the `atlas_root` hash carried on both export types. This file has essentially no logic of its own (no validation, no methods beyond field access) precisely because its whole job is to be a faithful, inert mirror of upstream data shape — any cleverness belongs either upstream (in the atlas) or downstream (in laws.rs, which does the actual checking).", "key_items": ["ChronologyExport — atlas_root + EventId -> ResolvedPlacement map + span-width ChronoSpans", "GazetteerExport — atlas_root + PlaceId -> GazetteerEntry map, the coordinate authority for survey waypoints", "GazetteerEntry — canonical_name/position plus optional aliases/provenance/attestations, absent metadata left genuinely absent", "ChronoSpan — an honest era/reign-width date, for when Scripture only supports span-granularity dating"]}, {"path": "crates/map-types/src/encode.rs", "title": "Encoders — the one-way door out of the semantic model", "role": "Defines SceneEncoder and TransitionEncoder, the two terminal traits every concrete output format (SVG, GeoJSON, vector tiles, GPU buffers, PDF, ...) must implement, so no format-specific knowledge ever leaks upstream of this point.", "newbie": "At some point the abstract, in-memory description of a map (a `Snapshot`, see scene.rs) has to become an actual file or set of bytes a browser or renderer can use — SVG for a webpage, or a buffer of triangles for a 3D graphics card, for example. This file defines the doorway all of those conversions must go through: a small, generic promise ('given a Snapshot, produce some Output, or fail with an error') that any specific output format implements separately. The point is that nothing upstream of this doorway is allowed to know or care which specific output format will eventually be used — new formats can be added, or old ones removed, without touching any of the map logic itself.", "intermediate": "`SceneEncoder` is a trait with an associated type `Output` and one method, `encode(&self, scene: &Snapshot) -> Result<Self::Output, EncodeError>` — different implementors (living in other crates, likely map-encoders) fix `Output` to `String` for SVG, `Vec<u8>` for a binary buffer, etc. `TransitionEncoder` mirrors this shape for `TransitionScript` (transition.rs), described as the 'promised treatment' for animation once transition encoding is built out. `EncodeError` is a simple `String`-wrapping newtype used by both traits.", "advanced": "The doc comment states 'law 11' explicitly and describes it as grep-enforced: no type or function upstream of this module is permitted to name a concrete output format, and this is checked by literally searching the crate source rather than relying on convention alone — a pragmatic, low-tech but effective way to keep an architectural boundary honest over time as multiple contributors touch the codebase. The same law requires every encoder to be deterministic (same scene + same encoder config always produces the same bytes), which is what lets encoded output participate in the same content-addressed caching scheme as everything upstream (ident.rs) — an encoder is effectively required to behave like a pure, referentially-transparent function even though the trait signature doesn't literally enforce purity. The third clause of law 11 — that composition (overlay, accumulation) must never happen after encoding, only on `Snapshot`s themselves — is what keeps encoded artifacts strictly as leaves of the data flow; this file's trait shapes (`&Snapshot -> Output`, no way to combine two `Output`s) structurally discourage but do not strictly prevent a downstream author from trying to compose post-encode bytes, so this remains a convention enforced by review/tests rather than the type system alone.", "key_items": ["SceneEncoder trait — encode(&Snapshot) -> Result<Output, EncodeError>, the terminal format boundary", "TransitionEncoder trait — the same shape for TransitionScript, for future animation backends", "EncodeError — a simple string-carrying error shared by both encoder traits", "Law 11 (encoder terminality) — grep-enforced: no concrete format name upstream; determinism required; no post-encode composition"]}, {"path": "crates/map-types/src/transition.rs", "title": "Transitions — animating history with honest verbs", "role": "Defines TransitionStep (Morph, FadeIn/Out, SplitAlong, MergeAcross) and TransitionScript, a sequenceable, format-free description of an anima
